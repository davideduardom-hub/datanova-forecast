<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datanova Forecast — Decisiones de inventario para negocios en crecimiento</title>
<meta name="description" content="Convierte tus ventas históricas en decisiones inteligentes de inventario: pronóstico de demanda, punto de reorden, stock de seguridad y alertas de quiebre.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 5h5v5h5v5h5v5h5' stroke='%230e3b34' stroke-width='2.1' fill='none'/%3E%3Ccircle cx='19.5' cy='4.5' r='2.5' fill='%23b45309'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   Datanova Forecast — design tokens

   Colour carries meaning: the four signal colours map one-to-one onto
   inventory states, and "healthy" is deliberately uncoloured. If a swatch
   appears on screen, something needs a decision.
   =========================================================================== */
:root{
  --ink-900:#0a1f1b; --ink-800:#0e3b34; --ink-700:#14574c; --ink-600:#1d7a6a;
  --ink-300:#8fb3ab; --ink-100:#d8e4e1;
  --paper:#f1f3f2; --raised:#fff; --sunken:#e7ebe9;
  --g-900:#16201e; --g-700:#3b4845; --g-500:#697672; --g-300:#a9b4b1;
  --g-200:#c9d2cf; --g-100:#e2e8e6;
  --critical:#9f1239; --critical-soft:#fce7ec;
  --warning:#b45309; --warning-soft:#fdf1e3;
  --excess:#3f3d9e;  --excess-soft:#ececf9;
  --ok:#697672;      --ok-soft:#eef1f0;
  --sans:"Archivo",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;border-color:var(--g-100)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--g-900);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-weight:620;letter-spacing:-.021em;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
a{color:var(--ink-700)}
table{border-collapse:collapse}
.tnum,table,.stat-v{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink-700);outline-offset:2px;border-radius:3px}
::selection{background:var(--ink-100)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* The explanatory prose — the part that is not a number — is set in serif so
   it reads as reasoning rather than interface chrome. */
.reasoning{font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--g-700);max-width:68ch}
.reasoning strong{color:var(--g-900);font-weight:600}
.reasoning em{font-style:italic}

.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.wrap-narrow{max-width:820px;margin:0 auto;padding:0 20px}
.card{background:var(--raised);border:1px solid var(--g-100);border-radius:10px}
.hidden{display:none!important}

/* A hairline that reads as a measurement mark. */
.tick{border-top:1px solid var(--g-100);position:relative;padding-top:16px}
.tick::before{content:"";position:absolute;top:-1px;left:0;width:28px;height:2px;background:var(--ink-800)}

/* ── header ── */
.hdr{position:sticky;top:0;z-index:30;background:rgba(241,243,242,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--g-100)}
.hdr-in{display:flex;align-items:center;gap:22px;height:56px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.brand b{color:var(--ink-800);font-weight:600;letter-spacing:-.02em}
.brand span{color:var(--g-500);font-weight:500;letter-spacing:-.02em}
.nav{display:flex;gap:2px;margin-left:4px}
.nav button{background:none;border:0;border-radius:6px;padding:6px 12px;font-size:13.5px;
  font-weight:500;color:var(--g-500);white-space:nowrap}
.nav button:hover{color:var(--ink-800)}
.nav button[aria-current=page]{background:var(--sunken);color:var(--ink-800)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ── language switch ── */
.lang{display:flex;align-items:center;gap:4px;border:1px solid var(--g-200);background:#fff;
  border-radius:7px;padding:2px 2px 2px 8px}
.lang svg{color:var(--g-300);flex-shrink:0}
.lang button{border:0;background:none;border-radius:5px;padding:4px 8px;font-size:12px;
  font-weight:600;color:var(--g-500)}
.lang button[aria-pressed=true]{background:var(--ink-800);color:#fff}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;
  border-radius:7px;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s;
  height:40px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-p{background:var(--ink-800);color:#fff}
.btn-p:hover{background:var(--ink-900)}
.btn-s{background:#fff;color:var(--g-900);border:1px solid var(--g-200)}
.btn-s:hover{background:var(--paper)}
.btn-g{background:none;color:var(--g-700)}
.btn-g:hover{background:var(--sunken)}
.btn-lg{height:48px;padding:0 24px;font-size:15px}
.btn-sm{height:32px;padding:0 12px;font-size:13px}

/* ── forms ── */
.field{display:block;margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field .help{font-size:12.5px;line-height:1.35;color:var(--g-500);margin-top:6px}
.ctrl{width:100%;height:40px;border:1px solid var(--g-200);border-radius:7px;background:#fff;
  padding:0 12px;font-size:14px;color:var(--g-900)}
.ctrl:focus{border-color:var(--ink-700);outline:0;box-shadow:0 0 0 2px var(--ink-100)}
select.ctrl{padding-right:28px}

/* ── stats ── */
.stat{padding:16px 20px}
.stat .lbl{font-size:12.5px;font-weight:500;color:var(--g-500)}
.stat .stat-v{font-size:26px;font-weight:600;line-height:1;margin-top:6px}
.stat .hint{font-size:12.5px;line-height:1.35;color:var(--g-500);margin-top:6px}

/* ── badges ── */
.risk{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 8px;
  font-size:12px;font-weight:500;white-space:nowrap}
.risk i{width:6px;height:6px;border-radius:99px;display:block}
.risk-critical{background:var(--critical-soft);color:var(--critical)}
.risk-critical i{background:var(--critical)}
.risk-warning{background:var(--warning-soft);color:var(--warning)}
.risk-warning i{background:var(--warning)}
.risk-overstock{background:var(--excess-soft);color:var(--excess)}
.risk-overstock i{background:var(--excess)}
.risk-healthy{color:var(--g-500)}
.risk-healthy i{background:var(--ok)}
.tag{display:inline-flex;align-items:center;border-radius:4px;padding:2px 6px;
  font-size:11px;font-weight:600}
.tag-a{background:var(--ink-800);color:#fff}
.tag-b{background:var(--ink-100);color:var(--ink-800)}
.tag-c{background:var(--sunken);color:var(--g-500)}
.tag-n{background:var(--sunken);color:var(--g-700)}

/* ── notices ── */
.notice{display:flex;border-radius:8px;overflow:hidden;margin-bottom:10px}
.notice .bar{width:3px;flex-shrink:0}
.notice .body{padding:12px 16px}
.notice .t{font-size:13.5px;font-weight:600}
.notice .d{font-size:13px;line-height:1.5;color:var(--g-700);margin-top:4px}
.n-error{background:var(--critical-soft)} .n-error .bar{background:var(--critical)}
.n-warn{background:var(--warning-soft)}  .n-warn .bar{background:var(--warning)}
.n-info{background:var(--sunken)}        .n-info .bar{background:var(--g-300)}
.n-ok{background:var(--ink-100)}         .n-ok .bar{background:var(--ink-600)}

/* ── tables ── */
.tbl-scroll{overflow-x:auto;border-top:1px solid var(--g-100)}
.tbl-scroll::-webkit-scrollbar{height:9px}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--g-200);border-radius:99px}
table.data{width:100%;min-width:900px}
table.data th{position:sticky;top:0;z-index:5;background:var(--raised);padding:10px 12px;
  font-size:12px;font-weight:600;color:var(--g-500);text-align:left;white-space:nowrap;
  cursor:pointer;user-select:none}
table.data th.num{text-align:right}
table.data th .arr{margin-left:4px;font-size:10px;opacity:0}
table.data th[aria-sort] .arr{opacity:.7}
table.data td{padding:10px 12px;font-size:13px;border-top:1px solid var(--g-100)}
table.data td.num{text-align:right}
table.data tbody tr:hover{background:var(--paper)}
.sku-link{color:var(--ink-700);font-weight:500;text-decoration:none;background:none;border:0;padding:0}
.sku-link:hover{text-decoration:underline}

/* ── misc ── */
.drop{margin:12px;border:2px dashed var(--g-200);border-radius:8px;padding:56px 24px;text-align:center;
  transition:border-color .15s,background-color .15s}
.drop.over{border-color:var(--ink-700);background:rgba(216,228,225,.4)}
.meter{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;flex:1}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar-row .n{width:36px;text-align:right;font-size:13px;font-weight:600}
.bar-row .b{height:7px;border-radius:99px;flex-shrink:0}
.bar-row .t{font-size:13px;color:var(--g-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--g-200);
  border-top-color:var(--ink-800);border-radius:99px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes settle{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.settle{animation:settle .36s cubic-bezier(.22,1,.36,1) both}
.grid{display:grid;gap:16px}
.steps{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin-bottom:20px}
.steps .s{font-weight:500;color:var(--g-300)}
.steps .s.on{color:var(--ink-800)}
.steps .s.done{color:var(--g-700)}
.steps .sep{color:var(--g-200)}
/* ── narrow screens ── */
/* Once a run exists the nav appears, and brand + nav + language no longer fit
   on one row at phone width. Give the nav its own scrollable row instead of
   letting the header push the page sideways. */
@media (max-width:760px){
  .hdr-in{flex-wrap:wrap;height:auto;padding:8px 0;gap:8px 12px}
  .brand{order:1}
  .hdr-right{order:2;margin-left:auto}
  .nav{order:3;width:100%;margin:0;overflow-x:auto;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
}
@media (max-width:420px){
  .brand span[style]{font-size:14px}
}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="brand" href="#" onclick="go('landing');return false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2 5h5v5h5v5h5v5h5" stroke="var(--ink-800)" stroke-width="2.1" stroke-linecap="square"/>
        <circle cx="19.5" cy="4.5" r="2.5" fill="var(--warning)"/>
      </svg>
      <span style="font-size:15px;white-space:nowrap"><b>Datanova</b> <span>Forecast</span></span>
    </a>
    <nav class="nav hidden" id="nav">
      <button data-view="dashboard" onclick="go('dashboard')"></button>
      <button data-view="abc" onclick="go('abc')"></button>
      <button data-view="upload" onclick="go('upload')"></button>
    </nav>
    <div class="hdr-right">
      <div class="lang" role="group" id="langGroup">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M3 12h18" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z"
                stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <button onclick="setLang('es')" lang="es" title="Español">ES<span class="sr">Español</span></button>
        <button onclick="setLang('en')" lang="en" title="English">EN<span class="sr">English</span></button>
      </div>
    </div>
  </div>
</header>

<main>

<!-- ══════════════════════════ LANDING ══════════════════════════ -->
<section id="v-landing" class="view">
  <div class="wrap" style="padding-top:60px;padding-bottom:72px">
    <div class="grid" id="heroGrid" style="align-items:center">
      <div>
        <h1 id="heroH1" style="font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;
            letter-spacing:-.03em;color:var(--ink-900);max-width:16ch"></h1>
        <p id="heroSub" style="margin-top:20px;max-width:46ch;font-size:16.5px;
            line-height:1.6;color:var(--g-700)"></p>
        <div style="margin-top:30px;display:flex;flex-wrap:wrap;gap:12px">
          <button class="btn btn-p btn-lg" id="heroCta" onclick="loadDemo()"></button>
          <button class="btn btn-s btn-lg" id="heroCta2" onclick="go('upload')"></button>
        </div>
        <p id="heroNote" style="margin-top:16px;font-size:13px;color:var(--g-500)"></p>
      </div>
      <figure class="card" style="margin:0;padding:28px">
        <div id="heroFig"></div>
        <figcaption class="reasoning" id="heroCap"
          style="margin-top:20px;border-top:1px solid var(--g-100);padding-top:16px"></figcaption>
      </figure>
    </div>
  </div>

  <div style="background:var(--raised);border-top:1px solid var(--g-100);border-bottom:1px solid var(--g-100)">
    <div class="wrap" style="padding:56px 20px">
      <p id="valueProp" style="max-width:34ch;font-size:clamp(1.3rem,3vw,1.9rem);font-weight:600;
          line-height:1.22;letter-spacing:-.025em;color:var(--ink-800)"></p>
    </div>
  </div>

  <div class="wrap" style="padding:72px 20px">
    <h2 id="howTitle" style="font-size:22px;letter-spacing:-.025em"></h2>
    <ol id="howList" class="grid" style="margin-top:32px;padding:0;list-style:none;
        grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:36px 40px"></ol>
  </div>

  <div style="background:var(--raised);border-top:1px solid var(--g-100)">
    <div class="wrap" style="padding:72px 20px">
      <h2 id="methTitle" style="font-size:22px;letter-spacing:-.025em;max-width:24ch"></h2>
      <div id="methList" class="grid" style="margin-top:34px;
          grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px 48px"></div>
    </div>
  </div>

  <div style="background:var(--ink-900)">
    <div class="wrap" style="padding:60px 20px;display:flex;flex-wrap:wrap;gap:24px;
        align-items:center;justify-content:space-between">
      <p id="ctaLine" style="max-width:24ch;font-size:clamp(1.2rem,3vw,1.65rem);font-weight:600;
          line-height:1.2;letter-spacing:-.025em;color:#fff"></p>
      <button class="btn btn-lg" id="ctaBtn" onclick="loadDemo()"
        style="background:#fff;color:var(--ink-900)"></button>
    </div>
  </div>
</section>

<!-- ══════════════════════════ UPLOAD ══════════════════════════ -->
<section id="v-upload" class="view hidden">
  <div class="wrap-narrow" style="padding:32px 20px 64px">
    <h1 id="upTitle" style="font-size:24px;letter-spacing:-.025em"></h1>
    <p id="upSub" style="margin-top:6px;max-width:60ch;font-size:14px;color:var(--g-500)"></p>
    <div class="steps" id="upSteps" style="margin-top:24px"></div>
    <div id="upNotices"></div>
    <div id="upStage"></div>
  </div>
</section>

<!-- ══════════════════════════ CONFIGURE ══════════════════════════ -->
<section id="v-configure" class="view hidden">
  <div class="wrap-narrow" style="padding:32px 20px 64px">
    <h1 id="cfTitle" style="font-size:24px;letter-spacing:-.025em"></h1>
    <p id="cfSub" style="margin-top:6px;max-width:60ch;font-size:14px;color:var(--g-500)"></p>
    <p id="cfUsing" style="margin-top:14px;font-size:13px;color:var(--g-500)"></p>
    <div id="cfNotice" style="margin-top:20px"></div>
    <div class="card" style="margin-top:20px">
      <div class="grid" id="cfGrid" style="padding:20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px"></div>
    </div>
    <div style="margin-top:24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <button class="btn btn-p btn-lg" id="cfRun" onclick="runAnalysis()"></button>
      <span id="cfProgress" style="font-size:13px;color:var(--g-500)"></span>
    </div>
  </div>
</section>

<!-- ══════════════════════════ DASHBOARD ══════════════════════════ -->
<section id="v-dashboard" class="view hidden">
  <div class="wrap" style="padding:28px 20px 64px">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between">
      <div>
        <h1 id="dashTitle" style="font-size:24px;letter-spacing:-.025em"></h1>
        <p id="dashMeta" style="margin-top:4px;font-size:13px;color:var(--g-500)"></p>
      </div>
      <button class="btn btn-s btn-sm" id="dashRecalc" onclick="go('configure')"></button>
    </div>

    <div id="dashNotices" style="margin-top:20px"></div>

    <div class="grid" id="dashTop" style="margin-top:16px"></div>

    <div class="card settle" style="margin-top:16px">
      <div style="padding:16px 20px 12px">
        <h3 id="triageTitle" style="font-size:15px"></h3>
        <p id="triageSub" style="margin-top:2px;font-size:13px;color:var(--g-500)"></p>
      </div>
      <div id="triageList"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div style="padding:16px 20px 12px">
        <h3 id="chartTitle" style="font-size:15px"></h3>
        <p id="chartSub" style="margin-top:2px;font-size:13px;color:var(--g-500)"></p>
      </div>
      <div id="dashChart" style="padding:0 12px 16px"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <div style="padding:16px 20px 12px"><h3 id="tableTitle" style="font-size:15px"></h3></div>
      <div id="tableControls" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 20px 12px"></div>
      <div class="tbl-scroll"><table class="data" id="riskTable"></table></div>
      <div id="tableEmpty" style="padding:40px 20px;text-align:center;font-size:13.5px;color:var(--g-500)" class="hidden"></div>
      <div id="tableMore" style="padding:12px 20px;text-align:center;border-top:1px solid var(--g-100)" class="hidden"></div>
    </div>

    <div class="grid" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="card">
        <div style="padding:16px 20px 12px">
          <h3 id="modelMixTitle" style="font-size:15px"></h3>
          <p id="modelMixSub" style="margin-top:2px;font-size:13px;color:var(--g-500)"></p>
        </div>
        <div id="modelMix" style="padding:0 20px 20px"></div>
      </div>
      <div class="card">
        <div style="padding:16px 20px 12px"><h3 id="patternMixTitle" style="font-size:15px"></h3></div>
        <div id="patternMix" style="padding:0 20px 20px"></div>
      </div>
    </div>
  </div>
</section>

<!-- ══════════════════════════ SKU DETAIL ══════════════════════════ -->
<section id="v-sku" class="view hidden">
  <div class="wrap" style="padding:28px 20px 64px" id="skuBody"></div>
</section>

<!-- ══════════════════════════ ABC ══════════════════════════ -->
<section id="v-abc" class="view hidden">
  <div class="wrap" style="padding:28px 20px 64px" id="abcBody"></div>
</section>

</main>

<footer style="border-top:1px solid var(--g-100);margin-top:0">
  <div class="wrap" style="padding:28px 20px;display:flex;flex-wrap:wrap;gap:12px;
      justify-content:space-between;font-size:12.5px;color:var(--g-500)">
    <span><b style="color:var(--ink-800)">Datanova</b> Forecast</span>
    <span id="footTag"></span>
  </div>
</footer>
<script>
var DF = (() => {
  var __create = Object.create;
  var __defProp = Object.defineProperty;
  var __getOwnPropDesc = Object.getOwnPropertyDescriptor;
  var __getOwnPropNames = Object.getOwnPropertyNames;

  var __hasOwnProp = Object.prototype.hasOwnProperty;

function t(key, vars) {
  var s = (EXTRA[state.lang] && EXTRA[state.lang][key]) || EXTRA.en[key] || key;
  if (vars) for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
var esNow = function () { return state.lang === "es"; };

var $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
var N = function (v, d) { return E.num(v, state.lang, d || 0); };
var M = function (v) { return E.money(v, state.lang); };
var C = function (v, cur) { return E.compact(v, state.lang, cur); };
var P = function (v, d) { return E.pct(v, state.lang, d || 0); };
var LD = function (v) { return E.longDate(v, state.lang); };

           healthy: t("rHealthy"), overstock: t("rOverstock") }[r] || r;

}

// Hero: a depletion path crossing its reorder point. Geometry is computed from
// the values so the labels always sit on the right part of the curve.
function depletionFigure() {
  var W = 560, H = 250, PL = 8, PR = 8, PT = 18, PB = 26;
  var start = 420, daily = 17, ss = 96, lt = 7, days = 30;
  var rop = ss + daily * lt, iw = W - PL - PR, ih = H - PT - PB, maxY = start * 1.08;
  var x = function (d) { return PL + (d / days) * iw; };
  var y = function (v) { return PT + ih - (v / maxY) * ih; };
  var wob = [1, .7, 1.35, .9, 1.1, 1.5, .6], path = [], v = start;
  for (var d = 0; d <= days; d++) { path.push({ d: d, v: Math.max(0, v) }); v -= daily * wob[d % 7]; }
  var line = path.map(function (p, i) { return (i ? "L" : "M") + x(p.d).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ");
  var area = line + " L" + x(days).toFixed(1) + "," + y(0).toFixed(1) + " L" + x(0).toFixed(1) + "," + y(0).toFixed(1) + " Z";
  var cross = function (lv) {
    for (var i = 1; i < path.length; i++) if (path[i].v <= lv) {
      var a = path[i - 1], b = path[i];
      return a.d + (a.v - lv) / Math.max(1e-6, a.v - b.v);
    }
    return null;
  };
  var rd = cross(rop), od = cross(0);
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto" role="img" aria-label="' + esc(t("figRop")) + '">';
  s += '<rect x="' + PL + '" y="' + y(ss) + '" width="' + iw + '" height="' + Math.max(0, y(0) - y(ss)) + '" fill="var(--critical)" opacity=".055"/>';
  s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(ss) + '" y2="' + y(ss) + '" stroke="var(--critical)" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>';
  s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(rop) + '" y2="' + y(rop) + '" stroke="var(--warning)" stroke-width="1.2" stroke-dasharray="5 4"/>';
  s += '<path d="' + area + '" fill="var(--ink-800)" opacity=".07"/>';
  s += '<path d="' + line + '" fill="none" stroke="var(--ink-800)" stroke-width="2.2" stroke-linejoin="round"/>';
  if (rd != null) {
    s += '<line x1="' + x(rd) + '" x2="' + x(rd) + '" y1="' + y(rop) + '" y2="' + (H - PB) + '" stroke="var(--warning)" stroke-width="1" opacity=".5"/>';
    s += '<circle cx="' + x(rd) + '" cy="' + y(rop) + '" r="5" fill="#fff" stroke="var(--warning)" stroke-width="2.5"/>';
    s += '<text x="' + x(rd) + '" y="' + (H - PB + 15) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--warning)">' + esc(t("figOrder")) + "</text>";
  }
  if (od != null && od <= days) {
    s += '<circle cx="' + x(od) + '" cy="' + y(0) + '" r="4.5" fill="var(--critical)"/>';
    s += '<text x="' + Math.min(x(od) + 8, W - PR) + '" y="' + (y(0) - 12) + '" text-anchor="start" font-size="11.5" font-weight="600" fill="var(--critical)">' + esc(t("figOut")) + "</text>";
  }
  s += '<text x="' + (PL + 2) + '" y="' + (y(rop) - 7) + '" font-size="11.5" font-weight="600" fill="var(--warning)">' + esc(t("figRop")) + "</text>";
  s += '<text x="' + (PL + 2) + '" y="' + (y(ss) + 15) + '" font-size="11.5" font-weight="600" fill="var(--critical)" opacity=".85">' + esc(t("figSs")) + "</text>";
  s += '<text x="' + (PL + 2) + '" y="' + (y(start) - 7) + '" font-size="11.5" font-weight="600" fill="var(--ink-800)">' + esc(t("figStock")) + "</text>";
  return s + "</svg>";
}

// Demand history + forecast with a confidence band.
function demandChart(hist, fc, h) {
  h = h || 260;
  var W = 900, PL = 48, PR = 12, PT = 16, PB = 26, H = h;
  var iw = W - PL - PR, ih = H - PT - PB;
  var all = hist.map(function (p) { return p.v; })
    .concat(fc.map(function (p) { return p.hi; }));
  var maxV = Math.max.apply(null, all.concat([1])) * 1.08;
  var nTot = hist.length + fc.length;
  if (!nTot) return "";
  var x = function (i) { return PL + (nTot < 2 ? 0 : (i / (nTot - 1)) * iw); };
  var y = function (v) { return PT + ih - (Math.max(0, v) / maxV) * ih; };

  var s = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto" role="img" aria-label="' + esc(t("chartTitle")) + '">';
  // gridlines
  for (var g = 0; g <= 4; g++) {
    var gv = (maxV / 4) * g, gy = y(gv);
    s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--g-100)"/>';
    s += '<text x="' + (PL - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="var(--g-500)">' + esc(C(gv)) + "</text>";
  }
  // forecast band
  if (fc.length) {
    var up = [], dn = [];
    for (var i = 0; i < fc.length; i++) {
      var xi = x(hist.length + i);
      up.push(xi.toFixed(1) + "," + y(fc[i].hi).toFixed(1));
      dn.unshift(xi.toFixed(1) + "," + y(fc[i].lo).toFixed(1));
    }
    s += '<polygon points="' + up.concat(dn).join(" ") + '" fill="var(--ink-600)" opacity=".14"/>';
  }
  // history line
  if (hist.length) {
    s += '<polyline fill="none" stroke="var(--ink-800)" stroke-width="1.9" stroke-linejoin="round" points="' +
      hist.map(function (p, i) { return x(i).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ") + '"/>';
  }
  // forecast line, joined to the last actual so there is no visual gap
  if (fc.length) {
    var pts = [];
    if (hist.length) pts.push(x(hist.length - 1).toFixed(1) + "," + y(hist[hist.length - 1].v).toFixed(1));
    for (var j = 0; j < fc.length; j++) pts.push(x(hist.length + j).toFixed(1) + "," + y(fc[j].v).toFixed(1));
    s += '<polyline fill="none" stroke="var(--warning)" stroke-width="2" stroke-dasharray="5 4" points="' + pts.join(" ") + '"/>';
    var sx = x(hist.length - 1);
    s += '<line x1="' + sx + '" x2="' + sx + '" y1="' + PT + '" y2="' + (PT + ih) + '" stroke="var(--g-300)" stroke-dasharray="2 3"/>';
  }
  // date ticks
  var labelAt = [0, Math.floor(nTot * .25), Math.floor(nTot * .5), Math.floor(nTot * .75), nTot - 1];
  var dates = hist.map(function (p) { return p.d; }).concat(fc.map(function (p) { return p.d; }));
  labelAt.forEach(function (i) {
    if (!dates[i]) return;
    s += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--g-500)">' +
      esc(E.shortDate(dates[i], state.lang)) + "</text>";
  });
  s += "</svg>";
  var legend = '<div style="display:flex;gap:18px;justify-content:flex-end;font-size:12.5px;color:var(--g-500);padding:0 12px 6px">' +
    '<span><span style="display:inline-block;width:14px;height:2px;background:var(--ink-800);vertical-align:middle;margin-right:5px"></span>' + esc(t("actual")) + "</span>" +
    '<span><span style="display:inline-block;width:14px;height:2px;background:var(--warning);vertical-align:middle;margin-right:5px"></span>' + esc(t("forecast")) + "</span></div>";
  return legend + s;
}

var VIEWS = ["landing", "upload", "configure", "dashboard", "sku", "abc"];

function go(v, arg) {
  state.view = v;
  if (v === "sku") state.skuOpen = arg;
  VIEWS.forEach(function (n) { $("v-" + n).classList.toggle("hidden", n !== v); });
  $("nav").classList.toggle("hidden", !state.run);
  var navMap = { dashboard: "dashboard", abc: "abc", upload: "upload", sku: "dashboard" };
  Array.prototype.forEach.call($("nav").children, function (b) {
    if (navMap[v] === b.dataset.view) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  render();
  window.scrollTo(0, 0);
}
window.go = go;

function setLang(l) {
  state.lang = l;
  try { localStorage.setItem("df_lang", l); } catch (e) {}
  document.documentElement.lang = l;
  render();
}
window.setLang = setLang;

function render() {
  Array.prototype.forEach.call($("langGroup").querySelectorAll("button"), function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("lang") === state.lang));
  });
  var nav = $("nav").children;
  nav[0].textContent = t("navDash"); nav[1].textContent = t("navAbc"); nav[2].textContent = t("navData");
  $("footTag").textContent = t("footTag");
  if (state.view === "landing") renderLanding();
  if (state.view === "upload") renderUpload();
  if (state.view === "configure") renderConfigure();
  if (state.view === "dashboard") renderDashboard();
  if (state.view === "sku") renderSku();
  if (state.view === "abc") renderAbc();
}

function dropzone(title, sub, kind) {
  return '<div class="card"><div class="drop" id="dz-' + kind + '"' +
    ' ondragover="dzOver(event,\'' + kind + '\',1)" ondragleave="dzOver(event,\'' + kind + '\',0)"' +
    ' ondrop="dzDrop(event,\'' + kind + '\')">' +
    '<input type="file" id="fi-' + kind + '" class="sr" accept=".csv,.tsv,.txt,.xlsx,.xls"' +
    ' onchange="pickFile(event,\'' + kind + '\')">' +
    '<button class="btn btn-g" style="font-size:15px;font-weight:600;color:var(--ink-800)"' +
    ' onclick="document.getElementById(\'fi-' + kind + '\').click()">' + esc(title) + "</button>" +
    '<p style="margin-top:8px;font-size:13px;color:var(--g-500)">' + esc(sub) + "</p></div></div>";
}
window.dzOver = function (e, kind, on) {
  e.preventDefault();
  $("dz-" + kind).classList.toggle("over", !!on);
};
window.dzDrop = function (e, kind) {
  e.preventDefault();
  $("dz-" + kind).classList.remove("over");
  var f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f, kind);
};
window.pickFile = function (e, kind) {
  var f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (f) handleFile(f, kind);
};
window.resetSales = function () {
  state.sales = null; state.salesStats = null; state.issues = []; state.lastFile = null;
  render();
};

function salesReview() {
  var s = state.salesStats;
  var cell = function (l, v, small) {
    return '<div><dt style="font-size:12.5px;color:var(--g-500)">' + esc(l) +
      '</dt><dd class="tnum" style="margin:4px 0 0;font-weight:600;font-size:' +

    cell(t("records"), N(s.recordCount)) + cell(t("skus"), N(s.skuCount)) +

function mappingList(map) {

    '<ul style="margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 20px">' +

function issueRow(i) {

// ───────────────────────────── dashboard ─────────────────────────────
function renderDashboard() {
  var r = state.run;
  if (!r) { go("upload"); return; }
  var sm = r.summary;
  $("dashTitle").textContent = t("dashTitle");
  $("dashMeta").textContent = t("dashMeta", {
    d: LD(r.at), n: sm.skusAnalysed, h: state.params.horizonDays,
    s: Math.round(state.params.serviceLevel * 100), ms: (r.ms / 1000).toFixed(1),
  });
  $("dashRecalc").textContent = t("recalc");
  $("dashNotices").innerHTML = sm.hasInventory ? "" :
    notice("info", esNow() ? "Sin datos de inventario" : "No inventory data",
      esc(t("cfNoInv")) + ' <button class="sku-link" onclick="state.upStep=\'inventory\';go(\'upload\')">' +
      esc(esNow() ? "Cargar inventario" : "Upload inventory") + "</button>");

  // health + KPI tiles
  var hc = r.health.components.map(function (c) {
    return '<li style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">' +
      '<span style="font-size:13px;font-weight:500">' + esc(esNow() ? c.labelEs : c.label) + "</span>" +
      '<span class="tnum" style="font-size:13px;color:var(--g-500)">' + c.score +
      ' <span style="font-size:11px">× ' + Math.round(c.weight * 100) + '%</span></span></div>' +
      '<p style="margin-top:2px;font-size:12.5px;line-height:1.35;color:var(--g-500)">' +
      esc(esNow() ? c.detailEs : c.detail) + "</p></li>";
  }).join("");
  var tone = r.health.score >= 80 ? "var(--ink-600)" : r.health.score >= 60 ? "var(--warning)" : "var(--critical)";

  var tile = function (lbl, val, hint, col) {
    return '<div class="card"><div class="stat"><div class="lbl">' + esc(lbl) + "</div>" +
      '<div class="stat-v"' + (col ? ' style="color:' + col + '"' : "") + ">" + esc(val) + "</div>" +
      (hint ? '<div class="hint">' + esc(hint) + "</div>" : "") + "</div></div>";
  };
  var hasInv = sm.hasInventory;
  var tiles =
    tile(t("atRisk"), N(sm.skusAtRisk), t("ofN", { n: sm.skusAnalysed }), sm.skusAtRisk > 0 ? "var(--critical)" : null) +
    tile(t("toReorder"), hasInv ? N(sm.skusToReorder) : "—", hasInv ? "" : t("needsInv")) +
    tile(t("stockoutValue"), hasInv ? C(sm.potentialStockoutValue, true) : "—", t("lostSales"),
      sm.potentialStockoutValue > 0 ? "var(--critical)" : null) +
    tile(t("fcDemand"), C(sm.forecastedDemand), t("unitsHorizon", { h: state.params.horizonDays })) +
    tile(t("excessValue"), hasInv ? C(sm.excessValue, true) : "—", t("capitalTied"),
      sm.excessValue > 0 ? "var(--excess)" : null) +
    tile(t("invValue"), hasInv ? C(sm.inventoryValue, true) : "—", t("atCost"));

  var wide = window.innerWidth >= 1000;
  $("dashTop").style.gridTemplateColumns = wide ? "minmax(0,1fr) minmax(0,1.9fr)" : "1fr";
  $("dashTop").innerHTML =
    '<div class="card" style="padding:20px"><h2 style="font-size:13px;font-weight:500;color:var(--g-500)">' +
    esc(t("health")) + "</h2>" +
    '<div style="display:flex;align-items:flex-end;gap:12px;margin-top:12px">' +
    '<div class="stat-v" style="font-size:40px;font-weight:600;line-height:1;color:' + tone + '">' +
    r.health.score + '<span style="font-size:18px;font-weight:500;color:var(--g-300)">/100</span></div>' +
    '<div class="meter" style="margin-bottom:6px"><i style="width:' +
    Math.max(2, Math.min(100, r.health.score)) + "%;background:" + tone + '"></i></div></div>' +
    '<p style="margin-top:12px;font-size:13.5px;font-weight:500">' +
    esc(esNow() ? r.health.headlineEs : r.health.headline) + "</p>" +
    '<ul style="margin:16px 0 0;padding:16px 0 0;list-style:none;border-top:1px solid var(--g-100)">' + hc + "</ul></div>" +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">' + tiles + "</div>";

  // triage — the product's actual job
  $("triageTitle").textContent = t("triageTitle");
  $("triageSub").textContent = t("triageSub");
  var rank = { critical: 0, warning: 1, overstock: 2 };
  var triage = r.plans.filter(function (p) { return p.risk !== "healthy"; })
    .sort(function (a, b) {
      if (rank[a.risk] !== rank[b.risk]) return rank[a.risk] - rank[b.risk];
      return (b.unmetValue + b.excessValue) - (a.unmetValue + a.excessValue);
    }).slice(0, 6);

  if (!triage.length) {
    $("triageList").innerHTML = '<div style="padding:48px 20px;text-align:center;border-top:1px solid var(--g-100)">' +
      '<h3 style="font-size:16px">' + esc(t("triageEmpty")) + "</h3>" +
      '<p style="margin-top:6px;font-size:13.5px;color:var(--g-500)">' + esc(t("triageEmptySub")) + "</p></div>";
  } else {
    $("triageList").innerHTML = '<ul style="margin:0;padding:0;list-style:none;border-top:1px solid var(--g-100)">' +
      triage.map(function (p) {
        var rec = p.recommendation, money = p.risk === "overstock" ? p.excessValue : p.unmetValue;
        return '<li style="padding:16px 20px;border-bottom:1px solid var(--g-100)">' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center">' + riskBadge(p.risk) +
          '<button class="sku-link" style="font-size:14px;font-weight:600;color:var(--ink-800)" onclick="go(\'sku\',\'' +
          esc(p.sku) + '\')">' + esc(p.product) + "</button>" +
          '<span style="font-size:12.5px;color:var(--g-500)">' + esc(p.sku) + "</span>" + abcTag(p.abc) +
          (p.confidence === "low" ? '<span class="tag tag-n">' + esc(t("lowConf")) + "</span>" : "") +
          (money > 0 ? '<span class="tnum" style="margin-left:auto;font-size:13px;font-weight:600">' +
            esc(M(money)) + "</span>" : "") + "</div>" +
          '<p style="margin-top:8px;font-size:14.5px;font-weight:600">' +
          esc(esNow() ? rec.headlineEs : rec.headline) + "</p>" +
          '<p class="reasoning" style="margin-top:6px">' + esc(esNow() ? rec.whyEs : rec.why) + "</p>" +
          '<p class="reasoning" style="margin-top:4px;font-style:italic">' +
          esc(esNow() ? rec.impactEs : rec.impact) + "</p></li>";
      }).join("") + "</ul>";
  }

  // aggregate chart
  $("chartTitle").textContent = t("chartTitle");
  $("chartSub").textContent = t("chartSub");
  var hist = {}, fcs = {};
  Object.keys(r.series).forEach(function (k) {
    r.series[k].history.forEach(function (h) { hist[h.date] = (hist[h.date] || 0) + h.value; });
    r.series[k].forecast.forEach(function (f) {
      var e = fcs[f.date] || (fcs[f.date] = { v: 0, vlo: 0, vhi: 0 });
      e.v += f.value;
      // Aggregate uncertainty in quadrature: adding each SKU's interval
      // end-to-end would assume every product misses the same way on the
      // same day, drawing a band several times too wide.
      e.vlo += Math.pow(f.value - f.lower, 2);
      e.vhi += Math.pow(f.upper - f.value, 2);
    });
  });
  var hd = Object.keys(hist).sort().slice(-120);
  var fd = Object.keys(fcs).sort();
  $("dashChart").innerHTML = demandChart(
    hd.map(function (d) { return { d: d, v: hist[d] }; }),
    fd.map(function (d) {
      var e = fcs[d];
      return { d: d, v: e.v, lo: Math.max(0, e.v - Math.sqrt(e.vlo)), hi: e.v + Math.sqrt(e.vhi) };
    }), 280);

  $("tableTitle").textContent = t("tableTitle");
  renderTable();

  // methodology transparency
  $("modelMixTitle").textContent = t("modelMix");
  $("modelMixSub").textContent = t("modelMixSub");
  $("patternMixTitle").textContent = t("patternMix");
  var bars = function (dist, colour, labeller) {
    var entries = Object.keys(dist).map(function (k) { return [k, dist[k]]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    return entries.map(function (e) {
      return '<div class="bar-row"><span class="n tnum">' + e[1] + "</span>" +
        '<span class="b" style="width:' + Math.max(4, (e[1] / sm.skusAnalysed) * 150) +
        "px;background:" + colour + '"></span><span class="t">' + esc(labeller(e[0])) + "</span></div>";
    }).join("");
  };
  $("modelMix").innerHTML = bars(sm.modelDistribution, "var(--ink-600)", function (k) {
    return E.modelLabel(k, state.lang);
  });
  $("patternMix").innerHTML = bars(sm.patternDistribution, "var(--g-300)", function (k) {

// ───────────────────────────── risk table ─────────────────────────────
var RISK_ORDER = { critical: 0, warning: 1, overstock: 2, healthy: 3 };

function tableRows() {
  var tb = state.table, q = tb.q.trim().toLowerCase();
  var rows = state.run.plans.filter(function (p) {
    if (tb.risk !== "all" && p.risk !== tb.risk) return false;
    if (tb.abc !== "all" && p.abc !== tb.abc) return false;
    if (!q) return true;
    return (p.sku + " " + p.product + " " + (p.category || "")).toLowerCase().indexOf(q) >= 0;
  });
  var get = function (p) {
    switch (tb.sort) {
      case "risk": return RISK_ORDER[p.risk];
      case "sku": return p.sku;
      case "product": return p.product;
      case "onHand": return p.onHand;
      case "horizonDemand": return p.horizonDemand;
      case "daysOfSupply": return p.daysOfSupply == null ? Number.MAX_SAFE_INTEGER : p.daysOfSupply;
      case "safetyStock": return p.safetyStock.value;
      case "reorderPoint": return p.reorderPoint;
      case "suggestedOrder": return p.suggestedOrder;
      default: return 0;
    }
  };
  return rows.sort(function (a, b) {
    var av = get(a), bv = get(b);
    if (typeof av === "string") return String(av).localeCompare(String(bv)) * tb.dir;
    if (tb.sort === "risk" && av === bv) {
      return (b.unmetValue + b.demandValue) - (a.unmetValue + a.demandValue);
    }
    return (av - bv) * tb.dir;
  });
}

      ">" + esc(c[1]) + '<span class="arr">' + (state.table.dir === 1 ? "▲" : "▼") + "</span></th>";
  }).join("") + "</tr></thead>";

  var rows = tableRows();
  var body = "<tbody>" + rows.slice(0, tb.limit).map(function (p) {
    var td = "";
    td += "<td>" + riskBadge(p.risk) + "</td>";

    td += '<td style="max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.product) + "</td>";

window.setTable = function (k, v) { state.table[k] = v; state.table.limit = 40; renderTable(); };
window.sortBy = function (k) {
  if (state.table.sort === k) state.table.dir = state.table.dir === 1 ? -1 : 1;
  else { state.table.sort = k; state.table.dir = (k === "sku" || k === "product" || k === "risk") ? 1 : -1; }

};

window.exportCsv = function () {
  var H = ["SKU", "Product", "Category", "ABC", "Demand pattern", "Forecast method",
    "Lead time (days)", "On hand", "On order", "Inventory position", "Avg daily demand",
    "Forecast (horizon)", "Demand over lead time", "Safety stock", "Safety stock method",
    "Reorder point", "Order-up-to level", "Suggested order", "Days of supply",
    "Projected stockout date", "Risk", "Confidence", "Lead-time WAPE", "Revenue at risk",
    "Excess units", "Inventory value", "Recommendation", "Why"];
  var q = function (v) {
    var s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.split('"').join('""') + '"' : s;
  };
  var lines = [H.join(",")];
  state.run.plans.forEach(function (p) {
    lines.push([p.sku, p.product, p.category || "", p.abc || "", p.pattern, p.model,
      p.leadTimeDays, p.onHand, p.onOrder, p.inventoryPosition, p.avgDailyDemand,
      p.horizonDemand, p.demandOverLeadTime, p.safetyStock.value, p.safetyStock.method,
      p.reorderPoint, p.targetLevel, p.suggestedOrder, p.daysOfSupply == null ? "" : p.daysOfSupply,
      p.projectedStockoutDate || "", p.risk, p.confidence, p.wape == null ? "" : p.wape,
      p.unmetValue, p.excessUnits, p.inventoryValue,
      esNow() ? p.recommendation.headlineEs : p.recommendation.headline,
      esNow() ? p.recommendation.whyEs : p.recommendation.why].map(q).join(","));
  });
  // BOM so Excel opens accented characters without an import wizard
  var blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "datanova-forecast.csv";
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
};

      h += '<p style="padding:0 20px 20px;font-size:13px;color:var(--g-500)">' + esc(t("abcEmpty")) + "</p>";

      h += '<div style="max-height:380px;overflow-y:auto;border-top:1px solid var(--g-100)">' +
        '<ul style="margin:0;padding:0;list-style:none">' + g.items.slice(0, 50).map(function (p) {
          return '<li style="display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:10px 20px;' +
            'border-bottom:1px solid var(--g-100)">' + riskBadge(p.risk) +
            '<button class="sku-link" style="font-size:13.5px" onclick="go(\'sku\',\'' + esc(p.sku) + '\')">' +
            esc(p.product) + "</button>" +
            '<span style="font-size:12.5px;color:var(--g-500)">' + esc(p.sku) + "</span>" +
            '<span class="tnum" style="margin-left:auto;font-size:13px;color:var(--g-700)">' + esc(M(p.demandValue)) + "</span>" +
            '<span class="tnum" style="width:100px;text-align:right;font-size:12.5px;color:var(--g-500)">' +
            esc(N(p.horizonDemand)) + " " + esc(t("units")) + "</span></li>";
        }).join("") + "</ul></div>";
    }
    h += "</div>";
  });
  $("abcBody").innerHTML = h;
}
// ───────────────────────── file handling ─────────────────────────

// SheetJS is only fetched when an actual spreadsheet is opened, so a CSV-only
// user never pays for 800 KB of parser — and the app still works offline.
var sheetJsPromise = null;
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve();
  if (sheetJsPromise) return sheetJsPromise;
  sheetJsPromise = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = function () { resolve(); };
    s.onerror = function () { sheetJsPromise = null; reject(new Error("SHEETJS_NOT_LOADED")); };
    document.head.appendChild(s);
  });
  return sheetJsPromise;
}

function showUploadError(msg) {
  $("upNotices").innerHTML = notice("error", msg);
}

function handleFile(file, kind) {
  $("upNotices").innerHTML = "";
  var isExcel = /\.(xlsx|xls)$/i.test(file.name);
  var step = isExcel ? loadSheetJs() : Promise.resolve();
  step.then(function () {
    return file.arrayBuffer();
  }).then(function (buf) {
    return E.readTable(buf, file.name);
  }).then(function (table) {
    if (kind === "sales") {
      state.lastFile = { table: table, name: file.name };
      applySalesValidation();
    } else {
      var known = state.sales ? new Set(state.sales.map(function (r) { return r.sku; })) : undefined;
      var v = E.validateInventory(table, known);
      state.invIssues = v.issues;
      state.invMapping = v.mapping;
      if (!v.ok) { state.inventory = null; showUploadError(firstErrorText(v.issues)); }
      else state.inventory = v.rows;
    }
    render();
  }).catch(function (err) {
    if (err && err.message === "SHEETJS_NOT_LOADED") showUploadError(t("errXlsx"));
    else if (err && err.messageEs) showUploadError(esNow() ? err.messageEs : err.message);
    else showUploadError(t("errRead") + (err && err.message ? " " + err.message : ""));
    render();
  });
}

function firstErrorText(issues) {
  for (var i = 0; i < issues.length; i++) {
    if (issues[i].severity === "error") return esNow() ? issues[i].titleEs : issues[i].title;
  }
  return t("errRead");
}

function applySalesValidation() {
  var v = E.validateSales(state.lastFile.table, state.clean);
  state.issues = v.issues;
  state.mapping = v.mapping;
  state.unmatched = v.unmatchedColumns;
  state.salesStats = v.stats;
  if (!v.ok) {
    state.sales = null;
    // Keep the review visible so the user can see what went wrong and adjust,
    // rather than being thrown back to an empty dropzone.
    state.salesStats = v.stats;
    showUploadError(firstErrorText(v.issues));
    if (!v.stats.recordCount) { state.lastFile = null; state.salesStats = null; }
  } else {
    state.sales = v.rows;
  }
}
function revalidate() { applySalesValidation(); render(); }

// ───────────────────────── demo dataset ─────────────────────────
// Generated in the browser from a fixed seed, so it is identical every time
// and the app needs no network and no companion data file.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildDemo() {
  var rand = mulberry32(20260622);
  var normal = function () {
    var u = Math.max(1e-9, rand()), v = Math.max(1e-9, rand());
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  var pick = function (a) { return a[Math.floor(rand() * a.length)]; };

  var CATS = ["Beverages", "Snacks", "Dairy", "Cleaning", "Personal Care", "Frozen"];
  var NAMES = {
    Beverages: ["Orange Juice 1L", "Sparkling Water 500ml", "Iced Tea 1.5L", "Energy Drink 250ml", "Cola 2L", "Coconut Water 330ml"],
    Snacks: ["Potato Chips 150g", "Granola Bar 6pk", "Salted Peanuts 200g", "Corn Tortillas 400g", "Chocolate Cookies 300g", "Rice Crackers 120g"],
    Dairy: ["Whole Milk 1L", "Greek Yogurt 500g", "Butter 250g", "Cheddar Block 400g", "Cream Cheese 200g", "Drinkable Yogurt 200ml"],
    Cleaning: ["Dish Soap 750ml", "Floor Cleaner 1L", "Bleach 2L", "Laundry Pods 20u", "Glass Cleaner 500ml", "Sponges 5pk"],
    "Personal Care": ["Shampoo 400ml", "Toothpaste 100ml", "Bar Soap 3pk", "Deodorant 150ml", "Hand Cream 75ml", "Razor Blades 4u"],
    Frozen: ["Frozen Peas 1kg", "Ice Cream 1L", "Frozen Pizza 400g", "Fish Fillets 500g", "French Fries 1kg", "Berry Mix 500g"],
  };
  var rep = function (v, n) { var a = []; for (var i = 0; i < n; i++) a.push(v); return a; };
  var PLAN = [].concat(rep("stable", 10), rep("trend_up", 6), rep("trend_down", 4),
    rep("weekly_seasonal", 7), rep("annual_seasonal", 6), rep("intermittent", 4),
    rep("intermittent_declining", 2), rep("intermittent_growing", 1), rep("lumpy", 5),
    rep("volatile", 3), rep("new_product", 2));
  var STOCK = [].concat(rep("critical", 7), rep("reorder", 12), rep("healthy", 23), rep("overstock", 8));

  var defs = [], used = {};
  for (var i = 0; i < 50; i++) {
    var cat = CATS[i % CATS.length], prod = pick(NAMES[cat]), guard = 0;
    while (used[prod] && guard++ < 20) prod = pick(NAMES[cat]);
    used[prod] = 1;
    var pat = PLAN[i], sparse = pat === "intermittent" || pat === "lumpy" || pat.indexOf("intermittent") === 0;
    defs.push({
      sku: "SKU" + ("00" + (i + 1)).slice(-3), product: prod, category: cat, pattern: pat,
      base: sparse ? 4 + rand() * 10 : 8 + rand() * 60,
      price: Math.round((1.2 + rand() * 18) * 100) / 100,
      leadTime: pick([3, 5, 7, 7, 10, 14, 21]),
      situation: STOCK[i],
    });
  }

  var DOW = [.75, .85, .9, 1, 1.25, 1.55, 1.1];
  var MON = [.75, .75, .85, .95, 1.1, 1.35, 1.5, 1.45, 1.1, .9, .85, 1.2];
  var DAYS = 730;
  var END = Date.UTC(2026, 8, 30), START = END - (DAYS - 1) * 86400000;

  var demandOn = function (def, tt, n, date) {
    var mu = def.base, dow = date.getUTCDay(), mo = date.getUTCMonth();
    switch (def.pattern) {
      case "trend_up": mu *= .55 + (.9 * tt) / n; break;
      case "trend_down": mu *= 1.45 - (.9 * tt) / n; break;
      case "weekly_seasonal": mu *= DOW[dow]; break;
      case "annual_seasonal": mu *= MON[mo]; break;
      case "new_product": mu *= tt < n * .55 ? 0 : Math.min(1.6, (tt - n * .55) / (n * .15)); break;
    }
    if (def.pattern === "intermittent") {
      if (rand() > .17) return 0;
      return Math.max(1, Math.round(def.base * (.6 + rand() * .9)));
    }
    if (def.pattern === "intermittent_declining") {
      // Obsolescence: the demand probability decays — the regime TSB handles
      // and classic Croston structurally cannot.
      var pd = .3 * Math.max(.05, 1 - (.6 * tt) / n);
      if (rand() > pd) return 0;
      return Math.max(1, Math.round(def.base * (.6 + rand() * .9)));
    }
    if (def.pattern === "intermittent_growing") {
      var pg = .06 + (.18 * tt) / n;
      if (rand() > pg) return 0;
      return Math.max(1, Math.round(def.base * (.6 + rand() * .9)));
    }
    if (def.pattern === "lumpy") {
      if (rand() > .11) return 0;
      return Math.max(1, Math.round(def.base * (.3 + rand() * 4.5)));
    }
    var cv = def.pattern === "volatile" ? .75 : .28;
    return Math.max(0, Math.round(mu + normal() * mu * cv));
  };

  var sales = [], demandBy = {};
  defs.forEach(function (def) {
    demandBy[def.sku] = [];
    for (var tt = 0; tt < DAYS; tt++) {
      var d = new Date(START + tt * 86400000);
      var q = demandOn(def, tt, DAYS, d);
      demandBy[def.sku].push(q);
      if (q <= 0) continue;   // a zero-sales day produces no transaction, like a real POS export
      sales.push({
        date: d.toISOString().slice(0, 10), sku: def.sku, product: def.product,
        category: def.category, qty: q,
        price: Math.round(def.price * (1 + normal() * .02) * 100) / 100,
      });
    }
  });

  var inventory = defs.map(function (def) {
    var recent = demandBy[def.sku].slice(-60);
    var avg = recent.reduce(function (s, v) { return s + v; }, 0) / recent.length;
    var lt = avg * def.leadTime, stock, onOrder = 0;
    if (def.situation === "critical") stock = Math.round(lt * (.15 + rand() * .35));
    else if (def.situation === "reorder") stock = Math.round(lt * (1 + rand() * .4));
    else if (def.situation === "overstock") stock = Math.round(avg * (110 + rand() * 120));
    else { stock = Math.round(avg * (25 + rand() * 30)); if (rand() > .7) onOrder = Math.round(avg * 10); }
    return {
      sku: def.sku, onHand: Math.max(0, stock), onOrder: onOrder,
      leadTimeDays: def.leadTime, unitCost: Math.round(def.price * (.55 + rand() * .15) * 100) / 100,
      moq: null, casePack: null,
    };
  });

  sales.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.sku < b.sku ? -1 : 1); });
  return { sales: sales, inventory: inventory };
}

function loadDemo() {
  $("heroCta").disabled = true;
  $("heroCta").textContent = t("genDemo");
  setTimeout(function () {
    var d = buildDemo();
    state.sales = d.sales;
    state.inventory = d.inventory;
    state.issues = []; state.invIssues = []; state.lastFile = null;
    state.mapping = {
      date: { header: "Date" }, sku: { header: "SKU" }, product: { header: "Product" },
      category: { header: "Category" }, quantity: { header: "Units Sold" }, price: { header: "Unit Price" },
    };
    state.unmatched = [];
    var skus = {}, firstD = d.sales[0].date, lastD = d.sales[d.sales.length - 1].date, days = {};
    d.sales.forEach(function (r) { skus[r.sku] = 1; days[r.date] = 1; });
    var span = Math.round((Date.parse(lastD) - Date.parse(firstD)) / 86400000) + 1;
    state.salesStats = {
      recordCount: d.sales.length, skuCount: Object.keys(skus).length,
      startDate: firstD, endDate: lastD, daysSpanned: span,
      monthsSpanned: Math.round((span / 30.44) * 10) / 10,
      missingCalendarDays: Math.max(0, span - Object.keys(days).length),
      skusWithShortHistory: [], skusWithSparseDemand: [], totalUnits: 0, totalRevenue: 0,
    };
    $("heroCta").disabled = false;
    $("heroCta").textContent = t("heroCta");
    go("configure");
  }, 30);
}
window.loadDemo = loadDemo;

// ───────────────────────── run the analysis ─────────────────────────

function runAnalysis() {
  if (state.busy) return;
  state.busy = true;
  renderConfigure();
  var t0 = Date.now();

  // Group by SKU
  var bySku = {}, order = [];
  state.sales.forEach(function (r) {
    var e = bySku[r.sku];
    if (!e) { e = bySku[r.sku] = { product: r.product, category: r.category, txns: [], ps: 0, pn: 0, units: 0 }; order.push(r.sku); }
    e.txns.push({ date: r.date, qty: r.qty });
    e.units += r.qty;
    if (r.price != null && isFinite(r.price)) { e.ps += r.price; e.pn++; }
  });
  var invBy = {};
  (state.inventory || []).forEach(function (r) { invBy[r.sku] = r; });

  var gStart = state.sales[0].date, gEnd = state.sales[state.sales.length - 1].date;
  var p = state.params;
  var planning = {
    serviceLevel: p.serviceLevel, leadTimeDays: p.leadTimeDays, leadTimeSdDays: p.leadTimeSdDays,
    reviewPeriodDays: p.reviewPeriodDays, overstockDays: p.overstockDays,
  };

  var plans = [], series = {}, models = {}, patterns = {}, idx = 0;

  // Yield to the browser between SKUs so the page stays responsive and the
  // progress counter actually paints.
  function step() {
    var deadline = Date.now() + 120;
    while (idx < order.length && Date.now() < deadline) {
      var sku = order[idx++], e = bySku[sku];
      try {
        var ds = E.buildDailySeries(e.txns, gStart, gEnd);
        if (!ds.dates.length) continue;
        var inv = invBy[sku];
        var fc = E.forecastSku(
          { sku: sku, product: e.product, category: e.category, dates: ds.dates, y: ds.y,
            avgUnitPrice: e.pn ? e.ps / e.pn : 0 },
          { horizonDays: p.horizonDays, leadTimeDays: (inv && inv.leadTimeDays) || p.leadTimeDays,
            serviceLevel: p.serviceLevel });
        var plan = E.buildPlan(fc, inv ? {
          sku: sku, onHand: inv.onHand, onOrder: inv.onOrder, backorders: 0,
          leadTimeDays: inv.leadTimeDays || p.leadTimeDays,
          moq: inv.moq || undefined, casePack: inv.casePack || undefined,
          unitCost: inv.unitCost == null ? undefined : inv.unitCost,
        } : undefined, planning, p.horizonDays);
        plans.push(plan);
        models[fc.selectedModel] = (models[fc.selectedModel] || 0) + 1;
        patterns[fc.profile.pattern] = (patterns[fc.profile.pattern] || 0) + 1;
        series[sku] = {
          history: fc.history.slice(-180),
          forecast: fc.points,
          candidates: fc.candidates.slice(0, 6).map(function (c) {
            return { modelId: c.modelId, wape: c.metrics.wape,
                     leadTimeWape: c.metrics.leadTimeWape, score: c.score };
          }),
          selectionReason: fc.selectionReason,
          selectionReasonEs: fc.selectionReasonEs,
          profile: { pattern: fc.profile.pattern, adi: fc.profile.adi, cv2: fc.profile.cv2,
                     zeroShare: fc.profile.zeroShare, caveats: fc.profile.caveats },
          metrics: { wape: fc.metrics.wape, mase: fc.metrics.mase, mape: fc.metrics.mape,
                     rmse: fc.metrics.rmse, mae: fc.metrics.mae, bias: fc.metrics.bias },
        };
      } catch (err) {
        // One pathological SKU must never take down the whole run.
        if (window.console) console.warn("SKU skipped:", sku, err);
      }
    }

    $("cfProgress").innerHTML = '<span class="spin"></span> ' +
      idx + " / " + order.length;

    if (idx < order.length) { setTimeout(step, 0); return; }

    E.classifyAbc(plans, { aCut: p.abcACut, bCut: p.abcBCut, criterion: p.abcCriterion });
    var health = E.computeHealthScore(plans);
    var sum = function (f) { return plans.reduce(function (s, x) { return s + f(x); }, 0); };
    state.run = {
      plans: plans, series: series, health: health,
      at: new Date().toISOString().slice(0, 10),
      ms: Date.now() - t0,
      summary: {
        totalSkus: order.length, skusAnalysed: plans.length,
        forecastedDemand: sum(function (x) { return x.horizonDemand; }),
        expectedRevenue: sum(function (x) { return x.demandValue; }),
        skusAtRisk: plans.filter(function (x) { return x.risk === "critical" || x.risk === "warning"; }).length,
        skusToReorder: plans.filter(function (x) { return x.suggestedOrder > 0; }).length,
        inventoryValue: sum(function (x) { return x.inventoryValue; }),
        potentialStockoutValue: sum(function (x) { return x.unmetValue; }),
        excessValue: sum(function (x) { return x.excessValue; }),
        hasInventory: plans.some(function (x) { return x.hasInventoryData; }),
        modelDistribution: models, patternDistribution: patterns,
      },
    };
    state.busy = false;
    $("cfProgress").textContent = "";
    state.table.limit = 40;
    go("dashboard");
  }
  setTimeout(step, 30);
}
window.runAnalysis = runAnalysis;

try {
  var saved = localStorage.getItem("df_lang");
  if (saved === "en" || saved === "es") state.lang = saved;
  else if ((navigator.language || "").toLowerCase().indexOf("es") === 0) state.lang = "es";
} catch (e) {}
document.documentElement.lang = state.lang;

var resizeTimer;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    if (state.view === "landing" || state.view === "dashboard") render();
  }, 180);
});

go("landing");
})();
