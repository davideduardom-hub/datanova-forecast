function statsFor(sales) {
  var skus = {}, days = {};
  sales.forEach(function (r) { skus[r.sku] = 1; days[r.date] = 1; });
  var first = sales[0].date, last = sales[sales.length - 1].date;
  var span = Math.round((Date.parse(last) - Date.parse(first)) / 86400000) + 1;
  return {
    recordCount: sales.length, skuCount: Object.keys(skus).length,
    startDate: first, endDate: last, daysSpanned: span,
    monthsSpanned: Math.round((span / 30.44) * 10) / 10,
    missingCalendarDays: Math.max(0, span - Object.keys(days).length),
    skusWithShortHistory: [], skusWithSparseDemand: [], totalUnits: 0, totalRevenue: 0,
  };
}

// ── demo A: distributor, 50 SKUs, 24 months, no production ──
function buildDistributorDemo() {
  var rand = mulberry32(20260622);
  var normal = function () {
    var u = Math.max(1e-9, rand()), v = Math.max(1e-9, rand());
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  var pick = function (a) { return a[Math.floor(rand() * a.length)]; };
  var CATS = ["Bebidas", "Snacks", "Lácteos", "Limpieza", "Cuidado Personal", "Congelados"];
  var NAMES = {
    "Bebidas": ["Jugo de Naranja 1L", "Agua con Gas 500ml", "Té Frío 1.5L", "Bebida Energética 250ml", "Cola 2L", "Agua de Coco 330ml"],
    "Snacks": ["Papas Fritas 150g", "Barra de Granola 6u", "Maní Salado 200g", "Tortillas de Maíz 400g", "Galletas de Chocolate 300g", "Galletas de Arroz 120g"],
    "Lácteos": ["Leche Entera 1L", "Yogur Griego 500g", "Mantequilla 250g", "Queso Cheddar 400g", "Queso Crema 200g", "Yogur Bebible 200ml"],
    "Limpieza": ["Lavavajillas 750ml", "Limpiapisos 1L", "Cloro 2L", "Cápsulas de Lavado 20u", "Limpiavidrios 500ml", "Esponjas 5u"],
    "Cuidado Personal": ["Shampoo 400ml", "Pasta Dental 100ml", "Jabón en Barra 3u", "Desodorante 150ml", "Crema de Manos 75ml", "Hojas de Afeitar 4u"],
    "Congelados": ["Arvejas Congeladas 1kg", "Helado 1L", "Pizza Congelada 400g", "Filetes de Pescado 500g", "Papas Fritas 1kg", "Mix de Berries 500g"],
  };
  var rep = function (v, n) { var a = []; for (var i = 0; i < n; i++) a.push(v); return a; };
  var PLAN = [].concat(rep("stable", 10), rep("trend_up", 6), rep("trend_down", 4),
    rep("weekly_seasonal", 7), rep("annual_seasonal", 6), rep("intermittent", 4),
    rep("intermittent_declining", 2), rep("intermittent_growing", 1), rep("lumpy", 5),
    rep("volatile", 3), rep("new_product", 2));
  var STOCK = [].concat(rep("critical", 6), rep("reorder", 11), rep("healthy", 25), rep("overstock", 8));

  var defs = [], used = {};
  for (var i = 0; i < 50; i++) {
    var cat = CATS[i % CATS.length], prod = pick(NAMES[cat]), guard = 0;
    while (used[prod] && guard++ < 20) prod = pick(NAMES[cat]);
    used[prod] = 1;
    var pat = PLAN[i], sparse = pat.indexOf("intermittent") === 0 || pat === "lumpy";
    defs.push({ sku: "SKU" + ("00" + (i + 1)).slice(-3), product: prod, category: cat, pattern: pat,
      base: sparse ? 4 + rand() * 10 : 8 + rand() * 60,
      price: Math.round((1.2 + rand() * 18) * 100) / 100,
      leadTime: pick([3, 5, 7, 7, 10, 14, 21]), situation: STOCK[i],
      // Perishables carry a real shelf life so the overstock test is honest.
      shelfLife: (cat === "Lácteos" ? pick([14, 21, 30]) :
                  cat === "Congelados" ? pick([180, 270]) :
                  cat === "Bebidas" ? pick([120, 180, 365]) : null) });
  }

  var DOW = [.75, .85, .9, 1, 1.25, 1.55, 1.1];
  var MON = [.75, .75, .85, .95, 1.1, 1.35, 1.5, 1.45, 1.1, .9, .85, 1.2];
  var DAYS = 730, END = Date.UTC(2026, 8, 30), START = END - (DAYS - 1) * 86400000;

  var demandOn = function (def, tt, n, date) {
    var mu = def.base, dow = date.getUTCDay(), mo = date.getUTCMonth();
    switch (def.pattern) {
      case "trend_up": mu *= .55 + (.9 * tt) / n; break;
      case "trend_down": mu *= 1.45 - (.9 * tt) / n; break;
      case "weekly_seasonal": mu *= DOW[dow]; break;
      case "annual_seasonal": mu *= MON[mo]; break;
      case "new_product": mu *= tt < n * .55 ? 0 : Math.min(1.6, (tt - n * .55) / (n * .15)); break;
    }
    if (def.pattern === "intermittent") {
      if (rand() > .17) return 0;
      return Math.max(1, Math.round(def.base * (.6 + rand() * .9)));
    }
    if (def.pattern === "intermittent_declining") {
      var pd = .3 * Math.max(.05, 1 - (.6 * tt) / n);
      if (rand() > pd) return 0;
      return Math.max(1, Math.round(def.base * (.6 + rand() * .9)));
    }
    if (def.pattern === "intermittent_growing") {
      if (rand() > .06 + (.18 * tt) / n) return 0;
      return Math.max(1, Math.round(def.base * (.6 + rand() * .9)));
    }
    if (def.pattern === "lumpy") {
      if (rand() > .11) return 0;
      return Math.max(1, Math.round(def.base * (.3 + rand() * 4.5)));
    }
    var cv = def.pattern === "volatile" ? .75 : .28;
    return Math.max(0, Math.round(mu + normal() * mu * cv));
  };

  var sales = [], demandBy = {};
  defs.forEach(function (def) {
    demandBy[def.sku] = [];
    for (var tt = 0; tt < DAYS; tt++) {
      var dt = new Date(START + tt * 86400000);
      var q = demandOn(def, tt, DAYS, dt);
      demandBy[def.sku].push(q);
      if (q <= 0) continue;
      sales.push({ date: dt.toISOString().slice(0, 10), sku: def.sku, product: def.product,
        category: def.category, qty: q,
        price: Math.round(def.price * (1 + normal() * .02) * 100) / 100 });
    }
  });

  var inventory = defs.map(function (def) {
    var recent = demandBy[def.sku].slice(-60);
    var avg = recent.reduce(function (s, v) { return s + v; }, 0) / recent.length;
    var lt = avg * def.leadTime, stock, onOrder = 0;
    if (def.situation === "critical") stock = Math.round(lt * (.15 + rand() * .35));
    else if (def.situation === "reorder") stock = Math.round(lt * (1 + rand() * .4));
    else if (def.situation === "overstock") stock = Math.round(avg * (110 + rand() * 120));
    else { stock = Math.round(avg * (25 + rand() * 30)); if (rand() > .7) onOrder = Math.round(avg * 10); }
    return { sku: def.sku, onHand: Math.max(0, stock), onOrder: onOrder,
      leadTimeDays: def.leadTime, shelfLifeDays: def.shelfLife,
      unitCost: Math.round(def.price * (.55 + rand() * .15) * 100) / 100,
      moq: null, casePack: null };
  });

  sales.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.sku < b.sku ? -1 : 1); });
  return { sales: sales, inventory: inventory, defaultLeadTime: 7 };
}

// ── demo B: artisan chocolate maker, 8 SKUs, recipes and perishable inputs ──
function buildChocolateDemo() {
  var rand = mulberry32(19990622);
  var normal = function () {
    var u = Math.max(1e-9, rand()), v = Math.max(1e-9, rand());
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  // Sized like a real Instagram-scale maker: roughly $15k/month, one person
  // producing in batches. Big enough for the maths to matter, small enough
  // that the numbers stay recognisable to someone running that business.
  var defs = [
    { sku: "PRD-001", product: "Caja Bombones 12u", base: 7, price: 18.00, pattern: "weekly_gift", shelf: 90 },
    { sku: "PRD-002", product: "Trufa Individual", base: 26, price: 2.50, pattern: "weekly", shelf: 45 },
    { sku: "PRD-003", product: "Tableta 70% 100g", base: 13, price: 7.00, pattern: "stable", shelf: 365 },

    { sku: "PRD-008", product: "Bombón Edición Especial", base: 1.3, price: 15.00, pattern: "lumpy", shelf: 30 },

  var DAYS = 430, END = Date.UTC(2026, 9, 5), START = END - (DAYS - 1) * 86400000;

      if (def.pattern === "weekly_gift") mu *= DOW_GIFT[dow] * MON_GIFT[mo];

      else if (def.pattern === "winter") mu *= DOW_REG[dow] * MON_WINTER[mo];
      else if (def.pattern === "stable") mu *= DOW_REG[dow];
      // The business grows slowly over the period, as a real one does.
      mu *= 0.82 + (0.36 * tt) / DAYS;

      } else {

  var inventory = defs.map(function (def, i) {

    else stock = Math.round(avg * (9 + rand() * 7));
    return { sku: def.sku, onHand: Math.max(0, stock), onOrder: 0,

  });

  var recipes = [
    ["PRD-001", "MAT-CHOC70", 240, "g", 4], ["PRD-001", "MAT-CREMA", 60, "ml", 3],
    ["PRD-001", "MAT-MANT", 24, "g", 2], ["PRD-001", "MAT-CAJA12", 1, "u", 1],

    ["PRD-004", "MAT-MANT", 48, "g", 2], ["PRD-004", "MAT-CAJA24", 1, "u", 1],
    ["PRD-004", "MAT-LAZO", 1, "u", 2],
    ["PRD-005", "MAT-CHOC70", 120, "g", 4], ["PRD-005", "MAT-CREMA", 30, "ml", 3],
    ["PRD-005", "MAT-CAJA12", 1, "u", 1],
    ["PRD-006", "MAT-CHOCB", 84, "g", 3], ["PRD-006", "MAT-ENVOL", 1, "u", 1],
    ["PRD-007", "MAT-CACAO", 180, "g", 2], ["PRD-007", "MAT-AZUCAR", 70, "g", 1],
    ["PRD-007", "MAT-ENVOL", 1, "u", 1],
    ["PRD-008", "MAT-CHOC70", 150, "g", 6], ["PRD-008", "MAT-CREMA", 40, "ml", 4],
    ["PRD-008", "MAT-CAJA12", 1, "u", 1],
  ].map(function (r) {
    return { sku: r[0], material: r[1], materialName: null, qtyPerUnit: r[2], unit: r[3], scrapPct: r[4] };

  var materials = [
    { code: "MAT-CHOC70", name: "Chocolate cobertura 70%", unit: "g", shelfLifeDays: 365,

      leadTimeDays: 14, leadTimeSdDays: 2, moq: 5000, packSize: 1000, unitCost: 0.019, onHand: 11000 },
    // The headline conflict: 21-day shelf life against a 24-litre minimum.
    // Stock sits just under the reorder point so the purchase is due now and

    { code: "MAT-CREMA", name: "Crema de leche fresca", unit: "ml", shelfLifeDays: 14,

    { code: "MAT-CACAO", name: "Cacao en polvo", unit: "g", shelfLifeDays: 540,

// ───────────────────────── run the analysis ─────────────────────────

function runAnalysis() {
  if (state.busy || !state.sales) return;
  state.busy = true;
  renderStep2();
  var t0 = Date.now();

  var bySku = {}, order = [];
  state.sales.forEach(function (r) {
    var e = bySku[r.sku];
    if (!e) { e = bySku[r.sku] = { product: r.product, category: r.category, txns: [], ps: 0, pn: 0 }; order.push(r.sku); }
    e.txns.push({ date: r.date, qty: r.qty });
    if (r.price != null && isFinite(r.price)) { e.ps += r.price; e.pn++; }
  });
  var invBy = {};
  (state.inventory || []).forEach(function (r) { invBy[r.sku] = r; });

  var gStart = state.sales[0].date, gEnd = state.sales[state.sales.length - 1].date;
  var p = state.params;
  var planning = {
    serviceLevel: p.serviceLevel, leadTimeDays: p.leadTimeDays, leadTimeSdDays: p.leadTimeSdDays,
    reviewPeriodDays: p.reviewPeriodDays, overstockDays: p.overstockDays,
  };

  var plans = [], series = {}, models = {}, patterns = {}, idx = 0;

  function step() {
    var deadline = Date.now() + 120;
    while (idx < order.length && Date.now() < deadline) {
      var sku = order[idx++], e = bySku[sku];
      try {
        var ds = E.buildDailySeries(e.txns, gStart, gEnd);
        if (!ds.dates.length) continue;
        var inv = invBy[sku];
        var fc = E.forecastSku(
          { sku: sku, product: e.product, category: e.category, dates: ds.dates, y: ds.y,
            avgUnitPrice: e.pn ? e.ps / e.pn : 0 },
          { horizonDays: p.horizonDays, leadTimeDays: (inv && inv.leadTimeDays) || p.leadTimeDays,
            serviceLevel: p.serviceLevel });
        var plan = E.buildPlan(fc, inv ? {
          sku: sku, onHand: inv.onHand, onOrder: inv.onOrder, backorders: 0,
          leadTimeDays: inv.leadTimeDays || p.leadTimeDays,
          moq: inv.moq || undefined, casePack: inv.casePack || undefined,
          unitCost: inv.unitCost == null ? undefined : inv.unitCost,
          shelfLifeDays: inv.shelfLifeDays == null ? undefined : inv.shelfLifeDays,
        } : undefined, planning, p.horizonDays);
        plans.push(plan);
        models[fc.selectedModel] = (models[fc.selectedModel] || 0) + 1;
        patterns[fc.profile.pattern] = (patterns[fc.profile.pattern] || 0) + 1;
        series[sku] = {
          history: fc.history.slice(-180), forecast: fc.points,
          candidates: fc.candidates.slice(0, 6).map(function (c) {
            return { modelId: c.modelId, wape: c.metrics.wape,
                     leadTimeWape: c.metrics.leadTimeWape, score: c.score };
          }),
          selectionReason: fc.selectionReason, selectionReasonEs: fc.selectionReasonEs,
          profile: { pattern: fc.profile.pattern, adi: fc.profile.adi, cv2: fc.profile.cv2,
                     zeroShare: fc.profile.zeroShare, caveats: fc.profile.caveats },
          metrics: { wape: fc.metrics.wape, mase: fc.metrics.mase, mape: fc.metrics.mape,
                     rmse: fc.metrics.rmse, mae: fc.metrics.mae, bias: fc.metrics.bias },
        };
      } catch (err) {
        if (window.console) console.warn("SKU omitido:", sku, err);
      }
    }

    $("cfProgress").innerHTML = '<span class="spin"></span> ' + idx + " / " + order.length;
    if (idx < order.length) { setTimeout(step, 0); return; }

    E.classifyAbc(plans, { aCut: p.abcACut, bCut: p.abcBCut, criterion: p.abcCriterion });
    var health = E.computeHealthScore(plans);
    var sum = function (f) { return plans.reduce(function (s, x) { return s + f(x); }, 0); };
    state.run = {
      plans: plans, series: series, health: health,
      at: new Date().toISOString().slice(0, 10), ms: Date.now() - t0,
      summary: {
        totalSkus: order.length, skusAnalysed: plans.length,
        forecastedDemand: sum(function (x) { return x.horizonDemand; }),
        expectedRevenue: sum(function (x) { return x.demandValue; }),
        skusAtRisk: plans.filter(function (x) { return x.risk === "critical" || x.risk === "warning"; }).length,
        skusToReorder: plans.filter(function (x) { return x.suggestedOrder > 0; }).length,
        inventoryValue: sum(function (x) { return x.inventoryValue; }),
        potentialStockoutValue: sum(function (x) { return x.unmetValue; }),
        excessValue: sum(function (x) { return x.excessValue; }),
        hasInventory: plans.some(function (x) { return x.hasInventoryData; }),
        modelDistribution: models, patternDistribution: patterns,
      },
    };

    // Explode the finished-goods plan into materials, when recipes exist.
    state.mrp = null;
    if (state.recipes && state.recipes.length) {
      try {
        state.mrp = MRP.run(plans, series, state.recipes, state.materials || [], {
          reviewPeriodDays: p.reviewPeriodDays,
          purchaseCoverDays: p.purchaseCoverDays,
          serviceLevel: p.serviceLevel,
          lang: state.lang,
        });
      } catch (err) {
        if (window.console) console.warn("MRP falló:", err);
      }
    }

    state.busy = false;
    $("cfProgress").textContent = "";
    state.table.limit = 40;
    state.tab = "demand";
    gotoStep(3);
  }
  setTimeout(step, 30);
}
window.runAnalysis = runAnalysis;

// ───────────────────────── init ─────────────────────────
try {
  var saved = localStorage.getItem("df_lang");
  if (saved === "en" || saved === "es") state.lang = saved;
  else if ((navigator.language || "").toLowerCase().indexOf("es") === 0) state.lang = "es";
} catch (e) {}
document.documentElement.lang = state.lang;

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !$("modal").classList.contains("hidden")) window.closeModal();
});

var resizeTimer;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    if (state.view === "landing" || (state.view === "work" && state.step === 3)) render();
  }, 180);
});

go("landing");
})();
</script>
</body>
</html>
