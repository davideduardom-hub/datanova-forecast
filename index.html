<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datanova Forecast — Decisiones de inventario para negocios en crecimiento</title>
<meta name="description" content="Convierte tus ventas históricas en decisiones inteligentes de inventario: pronóstico de demanda, punto de reorden, stock de seguridad y alertas de quiebre.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 5h5v5h5v5h5v5h5' stroke='%230e3b34' stroke-width='2.1' fill='none'/%3E%3Ccircle cx='19.5' cy='4.5' r='2.5' fill='%23b45309'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   Datanova Forecast — design tokens

   Colour carries meaning: the four signal colours map one-to-one onto
   inventory states, and "healthy" is deliberately uncoloured. If a swatch
   appears on screen, something needs a decision.
   =========================================================================== */
:root{
  --ink-900:#0a1f1b; --ink-800:#0e3b34; --ink-700:#14574c; --ink-600:#1d7a6a;
  --ink-300:#8fb3ab; --ink-100:#d8e4e1;
  --paper:#f1f3f2; --raised:#fff; --sunken:#e7ebe9;
  --g-900:#16201e; --g-700:#3b4845; --g-500:#697672; --g-300:#a9b4b1;
  --g-200:#c9d2cf; --g-100:#e2e8e6;
  --critical:#9f1239; --critical-soft:#fce7ec;
  --warning:#b45309; --warning-soft:#fdf1e3;
  --excess:#3f3d9e;  --excess-soft:#ececf9;
  --ok:#697672;      --ok-soft:#eef1f0;
  --sans:"Archivo",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;border-color:var(--g-100)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--g-900);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-weight:620;letter-spacing:-.021em;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
a{color:var(--ink-700)}
table{border-collapse:collapse}
.tnum,table,.stat-v{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink-700);outline-offset:2px;border-radius:3px}
::selection{background:var(--ink-100)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* The explanatory prose — the part that is not a number — is set in serif so
   it reads as reasoning rather than interface chrome. */
.reasoning{font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--g-700);max-width:68ch}
.reasoning strong{color:var(--g-900);font-weight:600}
.reasoning em{font-style:italic}

.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.wrap-narrow{max-width:820px;margin:0 auto;padding:0 20px}
.card{background:var(--raised);border:1px solid var(--g-100);border-radius:10px}
.hidden{display:none!important}

/* A hairline that reads as a measurement mark. */
.tick{border-top:1px solid var(--g-100);position:relative;padding-top:16px}
.tick::before{content:"";position:absolute;top:-1px;left:0;width:28px;height:2px;background:var(--ink-800)}

/* ── header ── */
.hdr{position:sticky;top:0;z-index:30;background:rgba(241,243,242,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--g-100)}
.hdr-in{display:flex;align-items:center;gap:22px;height:56px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.brand b{color:var(--ink-800);font-weight:600;letter-spacing:-.02em}
.brand span{color:var(--g-500);font-weight:500;letter-spacing:-.02em}
.nav{display:flex;gap:2px;margin-left:4px}
.nav button{background:none;border:0;border-radius:6px;padding:6px 12px;font-size:13.5px;
  font-weight:500;color:var(--g-500);white-space:nowrap}
.nav button:hover{color:var(--ink-800)}
.nav button[aria-current=page]{background:var(--sunken);color:var(--ink-800)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ── language switch ── */
.lang{display:flex;align-items:center;gap:4px;border:1px solid var(--g-200);background:#fff;
  border-radius:7px;padding:2px 2px 2px 8px}
.lang svg{color:var(--g-300);flex-shrink:0}
.lang button{border:0;background:none;border-radius:5px;padding:4px 8px;font-size:12px;
  font-weight:600;color:var(--g-500)}
.lang button[aria-pressed=true]{background:var(--ink-800);color:#fff}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;
  border-radius:7px;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s;
  height:40px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-p{background:var(--ink-800);color:#fff}
.btn-p:hover{background:var(--ink-900)}
.btn-s{background:#fff;color:var(--g-900);border:1px solid var(--g-200)}
.btn-s:hover{background:var(--paper)}
.btn-g{background:none;color:var(--g-700)}
.btn-g:hover{background:var(--sunken)}
.btn-lg{height:48px;padding:0 24px;font-size:15px}
.btn-sm{height:32px;padding:0 12px;font-size:13px}

/* ── forms ── */
.field{display:block;margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field .help{font-size:12.5px;line-height:1.35;color:var(--g-500);margin-top:6px}
.ctrl{width:100%;height:40px;border:1px solid var(--g-200);border-radius:7px;background:#fff;
  padding:0 12px;font-size:14px;color:var(--g-900)}
.ctrl:focus{border-color:var(--ink-700);outline:0;box-shadow:0 0 0 2px var(--ink-100)}
select.ctrl{padding-right:28px}

/* ── stats ── */
.stat{padding:16px 20px}
.stat .lbl{font-size:12.5px;font-weight:500;color:var(--g-500)}
.stat .stat-v{font-size:26px;font-weight:600;line-height:1;margin-top:6px}
.stat .hint{font-size:12.5px;line-height:1.35;color:var(--g-500);margin-top:6px}

/* ── badges ── */
.risk{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 8px;
  font-size:12px;font-weight:500;white-space:nowrap}
.risk i{width:6px;height:6px;border-radius:99px;display:block}
.risk-critical{background:var(--critical-soft);color:var(--critical)}
.risk-critical i{background:var(--critical)}
.risk-warning{background:var(--warning-soft);color:var(--warning)}
.risk-warning i{background:var(--warning)}
.risk-overstock{background:var(--excess-soft);color:var(--excess)}
.risk-overstock i{background:var(--excess)}
.risk-healthy{color:var(--g-500)}
.risk-healthy i{background:var(--ok)}
.tag{display:inline-flex;align-items:center;border-radius:4px;padding:2px 6px;
  font-size:11px;font-weight:600}
.tag-a{background:var(--ink-800);color:#fff}
.tag-b{background:var(--ink-100);color:var(--ink-800)}
.tag-c{background:var(--sunken);color:var(--g-500)}
.tag-n{background:var(--sunken);color:var(--g-700)}

/* ── notices ── */
.notice{display:flex;border-radius:8px;overflow:hidden;margin-bottom:10px}
.notice .bar{width:3px;flex-shrink:0}
.notice .body{padding:12px 16px}
.notice .t{font-size:13.5px;font-weight:600}
.notice .d{font-size:13px;line-height:1.5;color:var(--g-700);margin-top:4px}
.n-error{background:var(--critical-soft)} .n-error .bar{background:var(--critical)}
.n-warn{background:var(--warning-soft)}  .n-warn .bar{background:var(--warning)}
.n-info{background:var(--sunken)}        .n-info .bar{background:var(--g-300)}
.n-ok{background:var(--ink-100)}         .n-ok .bar{background:var(--ink-600)}

/* ── tables ── */
.tbl-scroll{overflow-x:auto;border-top:1px solid var(--g-100)}
.tbl-scroll::-webkit-scrollbar{height:9px}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--g-200);border-radius:99px}
table.data{width:100%;min-width:900px}
table.data th{position:sticky;top:0;z-index:5;background:var(--raised);padding:10px 12px;
  font-size:12px;font-weight:600;color:var(--g-500);text-align:left;white-space:nowrap;
  cursor:pointer;user-select:none}
table.data th.num{text-align:right}
table.data th .arr{margin-left:4px;font-size:10px;opacity:0}
table.data th[aria-sort] .arr{opacity:.7}
table.data td{padding:10px 12px;font-size:13px;border-top:1px solid var(--g-100)}
table.data td.num{text-align:right}
table.data tbody tr:hover{background:var(--paper)}
.sku-link{color:var(--ink-700);font-weight:500;text-decoration:none;background:none;border:0;padding:0}
.sku-link:hover{text-decoration:underline}

/* ── misc ── */
.drop{margin:12px;border:2px dashed var(--g-200);border-radius:8px;padding:56px 24px;text-align:center;
  transition:border-color .15s,background-color .15s}
.drop.over{border-color:var(--ink-700);background:rgba(216,228,225,.4)}
.meter{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;flex:1}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar-row .n{width:36px;text-align:right;font-size:13px;font-weight:600}
.bar-row .b{height:7px;border-radius:99px;flex-shrink:0}
.bar-row .t{font-size:13px;color:var(--g-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--g-200);
  border-top-color:var(--ink-800);border-radius:99px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes settle{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.settle{animation:settle .36s cubic-bezier(.22,1,.36,1) both}
.grid{display:grid;gap:16px}
.steps{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin-bottom:20px}
.steps .s{font-weight:500;color:var(--g-300)}
.steps .s.on{color:var(--ink-800)}
.steps .s.done{color:var(--g-700)}
.steps .sep{color:var(--g-200)}
/* ── the 1-2-3 rail ── */
.rail{position:sticky;top:56px;z-index:20;background:var(--raised);
  border-bottom:1px solid var(--g-100)}
.rail-in{display:flex;gap:4px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.rail-in::-webkit-scrollbar{display:none}
.rail-step{display:flex;align-items:center;gap:9px;padding:13px 16px 12px;border:0;background:none;
  border-bottom:2px solid transparent;white-space:nowrap;color:var(--g-300);font-size:13.5px;
  font-weight:500;transition:color .15s,border-color .15s}
.rail-step:disabled{cursor:not-allowed}
.rail-step .rn{display:flex;align-items:center;justify-content:center;width:21px;height:21px;
  border-radius:99px;background:var(--g-100);color:var(--g-500);font-size:11.5px;font-weight:700;
  flex-shrink:0}
.rail-step.done{color:var(--g-700)}
.rail-step.done .rn{background:var(--ink-100);color:var(--ink-800)}
.rail-step.on{color:var(--ink-800);border-bottom-color:var(--ink-800);font-weight:600}
.rail-step.on .rn{background:var(--ink-800);color:#fff}

.step-head{display:flex;gap:14px;align-items:flex-start}
.step-num{display:flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:99px;background:var(--ink-800);color:#fff;font-size:14px;font-weight:700;
  flex-shrink:0;margin-top:1px}

/* ── parameter group header ── */
.pgrp-h{padding:14px 20px 12px;border-bottom:1px solid var(--g-100)}
.pgrp-h h3{font-size:14.5px}
.pgrp-h p{margin-top:3px;font-size:12.5px;color:var(--g-500);max-width:70ch}

/* ── data slots ── */
.slot{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;background:var(--raised);
  border:1px solid var(--g-100);border-radius:10px;transition:border-color .15s}
.slot.filled{border-color:var(--ink-300)}
.slot.over{border-color:var(--ink-700);background:rgba(216,228,225,.35)}
.slot-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;background:var(--sunken);color:var(--g-500)}
.slot.filled .slot-ic{background:var(--ink-100);color:var(--ink-700)}
.slot-b{flex:1;min-width:0}
.slot-t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.slot-d{margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--g-500)}
.slot-a{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}
.req{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--critical);
  background:var(--critical-soft);padding:1px 5px;border-radius:3px}
.opt{font-size:10.5px;font-weight:600;color:var(--g-500);background:var(--sunken);
  padding:1px 5px;border-radius:3px}

/* ── tabs ── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g-100);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 14px;font-size:13.5px;font-weight:500;
  color:var(--g-500);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink-800)}
.tabs button[aria-selected=true]{color:var(--ink-800);font-weight:600;border-bottom-color:var(--ink-800)}
.tabs .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
  padding:0 4px;margin-left:6px;border-radius:99px;background:var(--critical);color:#fff;
  font-size:10.5px;font-weight:700;vertical-align:middle}

/* ── modal ── */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,31,27,.45);display:flex;
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal-box{background:var(--raised);border-radius:12px;width:100%;max-width:640px;
  box-shadow:0 18px 48px rgba(10,31,27,.22);margin:auto 0}

/* ── editor table ── */
table.edit{width:100%;font-size:13px}
table.edit th{text-align:left;padding:7px 8px;font-size:11.5px;font-weight:600;color:var(--g-500);
  border-bottom:1px solid var(--g-100);white-space:nowrap}
table.edit td{padding:4px 5px;border-bottom:1px solid var(--g-100);vertical-align:middle}
table.edit input,table.edit select{width:100%;height:32px;border:1px solid var(--g-200);
  border-radius:5px;padding:0 7px;font-size:12.5px;background:#fff;min-width:0}
table.edit input:focus,table.edit select:focus{border-color:var(--ink-700);outline:0}
.rm{border:0;background:none;color:var(--g-300);font-size:17px;line-height:1;padding:3px 6px;
  border-radius:4px}
.rm:hover{color:var(--critical);background:var(--critical-soft)}

/* ── misc ── */
.kv{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:9px 20px;
  border-top:1px solid var(--g-100)}
.kv dt{font-size:13px;color:var(--g-700)}
.kv dd{margin:0;font-size:14px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  background:var(--sunken);font-size:12px;color:var(--g-700)}

/* ── narrow screens ── */
/* Once a run exists the nav appears, and brand + nav + language no longer fit
   on one row at phone width. Give the nav its own scrollable row instead of
   letting the header push the page sideways. */
@media (max-width:760px){
  .rail{top:56px}
  .rail-step{padding:11px 11px 10px;font-size:12.5px;gap:7px}
  .step-head{gap:10px}
  .step-num{width:26px;height:26px;font-size:13px}
  .modal{padding:12px 8px}
}
/* The header has to survive brand + action + language on a phone. Drop the
   least informative pieces first: the restart label, then the wordmark. */
@media (max-width:560px){
  #btnRestart .rl{display:none}
  #btnRestart{padding:0 9px}
}
@media (max-width:430px){
  .brand .bw{display:none}
  .lang{padding-left:6px}
  .lang svg{display:none}
}
@media (max-width:420px){
  .brand span[style]{font-size:14px}
}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="brand" href="#" onclick="go('landing');return false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2 5h5v5h5v5h5v5h5" stroke="var(--ink-800)" stroke-width="2.1" stroke-linecap="square"/>
        <circle cx="19.5" cy="4.5" r="2.5" fill="var(--warning)"/>
      </svg>
      <span class="bw" style="font-size:15px;white-space:nowrap"><b>Datanova</b> <span>Forecast</span></span>
    </a>
    <div class="hdr-right">
      <button class="btn btn-g btn-sm hidden" id="btnRestart" onclick="restart()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 2.6-6.4M3 4v5h5" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span class="rl"></span></button>
      <div class="lang" role="group" id="langGroup">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M3 12h18" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z"
                stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <button onclick="setLang('es')" lang="es" title="Español">ES<span class="sr">Español</span></button>
        <button onclick="setLang('en')" lang="en" title="English">EN<span class="sr">English</span></button>
      </div>
    </div>
  </div>
</header>

<main>

<!-- ══════════════════════════ LANDING ══════════════════════════ -->
<section id="v-landing" class="view">
  <div class="wrap" style="padding-top:56px;padding-bottom:64px">
    <div class="grid" id="heroGrid" style="align-items:center">
      <div>
        <h1 id="heroH1" style="font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;
            letter-spacing:-.03em;color:var(--ink-900);max-width:16ch"></h1>
        <p id="heroSub" style="margin-top:20px;max-width:46ch;font-size:16.5px;
            line-height:1.6;color:var(--g-700)"></p>
        <div style="margin-top:30px;display:flex;flex-wrap:wrap;gap:12px">
          <button class="btn btn-p btn-lg" id="heroCta" onclick="openDemoPicker()"></button>
          <button class="btn btn-s btn-lg" id="heroCta2" onclick="go('work')"></button>
        </div>
        <p id="heroNote" style="margin-top:16px;font-size:13px;color:var(--g-500)"></p>
      </div>
      <figure class="card" style="margin:0;padding:28px">
        <div id="heroFig"></div>
        <figcaption class="reasoning" id="heroCap"
          style="margin-top:20px;border-top:1px solid var(--g-100);padding-top:16px"></figcaption>
      </figure>
    </div>
  </div>

  <div style="background:var(--raised);border-top:1px solid var(--g-100);border-bottom:1px solid var(--g-100)">
    <div class="wrap" style="padding:52px 20px">
      <p id="valueProp" style="max-width:34ch;font-size:clamp(1.3rem,3vw,1.9rem);font-weight:600;
          line-height:1.22;letter-spacing:-.025em;color:var(--ink-800)"></p>
    </div>
  </div>

  <div class="wrap" style="padding:64px 20px">
    <h2 id="howTitle" style="font-size:22px;letter-spacing:-.025em"></h2>
    <ol id="howList" class="grid" style="margin-top:32px;padding:0;list-style:none;
        grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:36px 40px"></ol>
  </div>

  <div style="background:var(--raised);border-top:1px solid var(--g-100)">
    <div class="wrap" style="padding:64px 20px">
      <h2 id="methTitle" style="font-size:22px;letter-spacing:-.025em;max-width:26ch"></h2>
      <div id="methList" class="grid" style="margin-top:34px;
          grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px 48px"></div>
    </div>
  </div>

  <div style="background:var(--ink-900)">
    <div class="wrap" style="padding:56px 20px;display:flex;flex-wrap:wrap;gap:24px;
        align-items:center;justify-content:space-between">
      <p id="ctaLine" style="max-width:24ch;font-size:clamp(1.2rem,3vw,1.65rem);font-weight:600;
          line-height:1.2;letter-spacing:-.025em;color:#fff"></p>
      <button class="btn btn-lg" id="ctaBtn" onclick="openDemoPicker()"
        style="background:#fff;color:var(--ink-900)"></button>
    </div>
  </div>
</section>

<!-- ══════════════════════════ WORKSPACE (1-2-3) ══════════════════════════ -->
<section id="v-work" class="view hidden">
  <!-- the three steps, always visible, always in order -->
  <div class="rail">
    <div class="wrap rail-in" id="rail"></div>
  </div>

  <div class="wrap" style="padding:24px 20px 72px">

    <!-- ─────── STEP 1 · DATA ─────── -->
    <div id="step-1" class="step">
      <div class="step-head">
        <span class="step-num">1</span>
        <div>
          <h2 id="s1Title" style="font-size:20px;letter-spacing:-.025em"></h2>
          <p id="s1Sub" style="margin-top:4px;font-size:14px;color:var(--g-500);max-width:68ch"></p>
        </div>
      </div>

      <div id="tmplCard" class="card" style="margin-top:20px"></div>
      <div id="dataNotices" style="margin-top:16px"></div>
      <div id="dataSlots" class="grid" style="margin-top:16px;
        grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"></div>
      <div id="dataDetail" style="margin-top:16px"></div>

      <div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <button class="btn btn-p btn-lg" id="s1Next" onclick="gotoStep(2)"></button>
        <button class="btn btn-g" id="s1Demo" onclick="openDemoPicker()"></button>
      </div>
    </div>

    <!-- ─────── STEP 2 · PARAMETERS ─────── -->
    <div id="step-2" class="step hidden">
      <div class="step-head">
        <span class="step-num">2</span>
        <div>
          <h2 id="s2Title" style="font-size:20px;letter-spacing:-.025em"></h2>
          <p id="s2Sub" style="margin-top:4px;font-size:14px;color:var(--g-500);max-width:68ch"></p>
        </div>
      </div>

      <p id="cfUsing" style="margin-top:16px;font-size:13px;color:var(--g-500)"></p>
      <div id="cfNotice" style="margin-top:14px"></div>

      <div class="card" style="margin-top:16px">
        <div class="pgrp-h" id="cfDemandH"></div>
        <div class="grid" id="cfGrid" style="padding:18px 20px;
          grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px"></div>
      </div>

      <div class="card hidden" id="cfMatCard" style="margin-top:16px">
        <div class="pgrp-h" id="cfMatH"></div>
        <div class="grid" id="cfMatGrid" style="padding:18px 20px;
          grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px"></div>
      </div>

      <div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <button class="btn btn-p btn-lg" id="cfRun" onclick="runAnalysis()"></button>
        <button class="btn btn-g" onclick="gotoStep(1)" id="s2Back"></button>
        <span id="cfProgress" style="font-size:13px;color:var(--g-500)"></span>
      </div>
    </div>

    <!-- ─────── STEP 3 · RESULTS ─────── -->
    <div id="step-3" class="step hidden">
      <div class="step-head">
        <span class="step-num">3</span>
        <div style="flex:1;min-width:0">
          <h2 id="s3Title" style="font-size:20px;letter-spacing:-.025em"></h2>
          <p id="dashMeta" style="margin-top:4px;font-size:13px;color:var(--g-500)"></p>
        </div>
        <button class="btn btn-s btn-sm" id="dashRecalc" onclick="gotoStep(2)"></button>
      </div>

      <div class="tabs" id="resTabs" style="margin-top:20px"></div>

      <!-- tab: demand & inventory -->
      <div id="tab-demand">
        <div id="dashNotices" style="margin-top:16px"></div>
        <div class="grid" id="dashTop" style="margin-top:16px"></div>

        <div class="card settle" style="margin-top:16px">
          <div style="padding:16px 20px 12px">
            <h3 id="triageTitle" style="font-size:15px"></h3>
            <p id="triageSub" style="margin-top:2px;font-size:13px;color:var(--g-500)"></p>
          </div>
          <div id="triageList"></div>
        </div>

        <div class="card" style="margin-top:16px">
          <div style="padding:16px 20px 12px">
            <h3 id="chartTitle" style="font-size:15px"></h3>
            <p id="chartSub" style="margin-top:2px;font-size:13px;color:var(--g-500)"></p>
          </div>
          <div id="dashChart" style="padding:0 12px 16px"></div>
        </div>

        <div class="card" style="margin-top:16px">
          <div style="padding:16px 20px 12px"><h3 id="tableTitle" style="font-size:15px"></h3></div>
          <div id="tableControls" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 20px 12px"></div>
          <div class="tbl-scroll"><table class="data" id="riskTable"></table></div>
          <div id="tableEmpty" style="padding:40px 20px;text-align:center;font-size:13.5px;color:var(--g-500)" class="hidden"></div>
          <div id="tableMore" style="padding:12px 20px;text-align:center;border-top:1px solid var(--g-100)" class="hidden"></div>
        </div>

        <div class="grid" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
          <div class="card">
            <div style="padding:16px 20px 12px">
              <h3 id="modelMixTitle" style="font-size:15px"></h3>
              <p id="modelMixSub" style="margin-top:2px;font-size:13px;color:var(--g-500)"></p>
            </div>
            <div id="modelMix" style="padding:0 20px 20px"></div>
          </div>
          <div class="card">
            <div style="padding:16px 20px 12px"><h3 id="patternMixTitle" style="font-size:15px"></h3></div>
            <div id="patternMix" style="padding:0 20px 20px"></div>
          </div>
        </div>
      </div>

      <!-- tab: materials -->
      <div id="tab-materials" class="hidden"><div id="matBody"></div></div>

      <!-- tab: ABC -->
      <div id="tab-abc" class="hidden"><div id="abcBody"></div></div>
    </div>
  </div>
</section>

<!-- ══════════════════════════ SKU DETAIL ══════════════════════════ -->
<section id="v-sku" class="view hidden">
  <div class="wrap" style="padding:28px 20px 64px" id="skuBody"></div>
</section>

</main>

<!-- ══════════════════════════ MODAL ══════════════════════════ -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" onclick="modalBackdrop(event)">
  <div class="modal-box" id="modalBox"></div>
</div>

<footer style="border-top:1px solid var(--g-100);background:var(--raised)">
  <div class="wrap" style="padding:28px 20px;display:flex;flex-wrap:wrap;gap:20px;
      align-items:center;justify-content:space-between">
    <div>
      <p style="font-size:13px;color:var(--g-700)"><b style="color:var(--ink-800)">Datanova</b> Forecast</p>
      <p id="footTag" style="margin-top:2px;font-size:12.5px;color:var(--g-500)"></p>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="footBy" style="font-size:12.5px;color:var(--g-500)"></span>
      <img id="footLogo" alt="Datanova Studio" style="height:30px;width:auto;display:block">
    </div>
  </div>
</footer>

    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  if (pp > 1 - pl) {
    q = Math.sqrt(-2 * Math.log(1 - pp));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  q = pp - 0.5; r = q * q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

// ───────────────────── 1. master production schedule ─────────────────────
/**
 * Derive the time-phased production (or replenishment) schedule for one SKU
 * under a periodic-review, order-up-to policy — the policy a small business
 * actually runs: "every Monday I look at stock and make a batch".
 *
 * MRP must explode the production schedule, not raw demand. Exploding demand
 * directly ignores the stock you already hold and the lot sizes you actually
 * produce in, which is how material plans end up asking you to buy things you
 * do not need yet.
 */
function productionSchedule(plan, forecastPoints, reviewPeriodDays) {
  var orders = [];
  if (!forecastPoints || !forecastPoints.length) return orders;

  var position = plan.hasInventoryData ? plan.inventoryPosition : 0;
  var R = Math.max(1, Math.round(reviewPeriodDays));
  var L = Math.max(1, Math.round(plan.leadTimeDays));
  var target = plan.targetLevel;

  // Open orders already in the pipeline arrive before anything we plan now.
  for (var i = 0; i < forecastPoints.length; i++) {
    var p = forecastPoints[i];
    position -= p.value;

    // Review day: raise the position back to the order-up-to level.
    if (i % R === 0) {
      var qty = target - position;
      if (qty > 0.0001) {
        qty = applyLotSize(qty, plan.moq, plan.casePack);
        orders.push({
          // The batch is produced on the review day and is available after the
          // production lead time; materials must be on hand when it starts.
          startDate: p.date,
          availableDate: addDays(p.date, L),
          qty: qty,
        });
        position += qty;
      }
    }
  }
  return orders;
}

function applyLotSize(qty, moq, packSize) {
  if (qty <= 0) return 0;
  var q = qty;
  if (packSize && packSize > 1) q = Math.ceil(q / packSize) * packSize;
  if (moq && q < moq) q = moq;
  return q;
}

// ───────────────────── 2. explode the recipes ─────────────────────
/**
 * Gross material requirements by day.
 *
 * Scrap is applied as a yield divisor, not a multiplier: if 5% of the
 * chocolate is lost in tempering, you must buy qty/(1−0.05), not qty×1.05.
 * The two differ by more than people expect once scrap climbs.
 */
function explode(schedules, bomBySku) {
  var gross = {};   // material -> { date -> qty }
  var drivers = {}; // material -> { sku -> qty }  (what is pulling each material)

  Object.keys(schedules).forEach(function (sku) {
    var lines = bomBySku[sku];
    if (!lines || !lines.length) return;
    schedules[sku].forEach(function (order) {
      lines.forEach(function (line) {
        var scrap = Math.min(0.95, Math.max(0, (line.scrapPct || 0) / 100));
        var need = (order.qty * line.qtyPerUnit) / (1 - scrap);
        if (!gross[line.material]) gross[line.material] = {};
        gross[line.material][order.startDate] = (gross[line.material][order.startDate] || 0) + need;
        if (!drivers[line.material]) drivers[line.material] = {};
        drivers[line.material][sku] = (drivers[line.material][sku] || 0) + need;
      });
    });
  });
  return { gross: gross, drivers: drivers };
}

// ───────────────────── 3. net, lot-size and offset ─────────────────────

function planMaterial(mat, byDate, drivers, opts) {
  var dates = Object.keys(byDate).sort();
  var horizonStart = opts.startDate;
  var horizonEnd = opts.endDate;
  var totalGross = dates.reduce(function (s, d) { return s + byDate[d]; }, 0);
  var horizonDays = Math.max(1, daysBetween(horizonStart, horizonEnd) + 1);
  var avgDaily = totalGross / horizonDays;

  var L = Math.max(0, Math.round(mat.leadTimeDays || 0));
  var shelf = mat.shelfLifeDays && mat.shelfLifeDays > 0 ? mat.shelfLifeDays : null;

  // Supply-side buffer only. Demand-side uncertainty is already carried by the
  // finished good; adding it again here would double-buffer the same risk.
  var ltSd = Math.max(0, mat.leadTimeSdDays || 0);
  var safetyStock = ltSd > 0 ? round2(zScore(opts.serviceLevel) * avgDaily * ltSd) : 0;
  if (shelf && safetyStock > avgDaily * shelf * 0.5) {
    // Never buffer more than half a shelf life — beyond that the buffer spoils
    // faster than it protects.
    safetyStock = round2(avgDaily * shelf * 0.5);
  }

  // How much coverage one purchase should aim for, before MOQ distorts it.
  var coverTarget = Math.max(1, Math.round(opts.purchaseCoverDays));
  if (shelf) coverTarget = Math.min(coverTarget, Math.max(1, Math.floor(shelf * 0.8)));

  var onHand = mat.onHand || 0;
  var available = onHand;
  var orders = [];
  var runOutDate = null;
  var firstShortfallDate = null;

  // Walk the horizon day by day so coverage and spoilage are measured against
  // the real consumption pattern rather than an average.
  var cursor = horizonStart;
  var dayIdx = 0;
  var consumed = [];
  while (dayIdx < horizonDays) {
    var need = byDate[cursor] || 0;
    consumed.push({ date: cursor, qty: need });
    cursor = addDays(cursor, 1);
    dayIdx++;
  }

  for (var i = 0; i < consumed.length; i++) {
    var d = consumed[i].date, req = consumed[i].qty;
    available -= req;

    if (available < safetyStock - 1e-9 && req > 0) {
      if (!firstShortfallDate) firstShortfallDate = d;
      if (available < 0 && !runOutDate) runOutDate = d;

      // Order enough to cover the next `coverTarget` days of real consumption,
      // plus whatever is needed to climb back to the safety level.
      var forward = 0;
      for (var k = i; k < Math.min(consumed.length, i + coverTarget); k++) forward += consumed[k].qty;
      var want = Math.max(req, forward) + safetyStock - available;
      var qty = applyLotSize(want, mat.moq, mat.packSize);

      // How many days of consumption does this quantity actually cover?
      var cum = 0, coverDays = 0;
      for (var j = i; j < consumed.length && cum < qty; j++) { cum += consumed[j].qty; coverDays++; }
      if (cum < qty && avgDaily > 0) coverDays += Math.ceil((qty - cum) / avgDaily);

      var releaseDate = addDays(d, -L);
      orders.push({
        needDate: d,
        releaseDate: releaseDate,
        qty: round2(qty),
        coverageDays: coverDays,
        // A release date already in the past means the order is overdue the
        // moment the plan is produced — the single most actionable alert here.
        late: daysBetween(horizonStart, releaseDate) < 0,
        daysLate: Math.max(0, -daysBetween(horizonStart, releaseDate)),
      });
      available += qty;
    }
  }

  // ── shelf life ──
  var shelfRisk = null;
  if (shelf && orders.length) {
    var worst = orders.reduce(function (a, b) { return b.coverageDays > a.coverageDays ? b : a; });
    if (worst.coverageDays > shelf) {
      var usable = 0;
      // Units actually consumed before the lot expires.
      var startIdx = consumed.findIndex(function (c) { return c.date === worst.needDate; });
      for (var m = Math.max(0, startIdx); m < Math.min(consumed.length, Math.max(0, startIdx) + shelf); m++) {
        usable += consumed[m].qty;
      }
      if (usable < worst.qty) {
        var waste = worst.qty - usable;
        var forcedByMoq = mat.moq && worst.qty <= mat.moq + 1e-9;
        shelfRisk = {
          wasteUnits: round2(waste),
          wasteValue: round2(waste * (mat.unitCost || 0)),
          coverageDays: worst.coverageDays,
          shelfLifeDays: shelf,
          orderQty: worst.qty,
          forcedByMoq: !!forcedByMoq,
        };
      }
    }
  }

  var coverageDays = avgDaily > 1e-9 ? Math.round(onHand / avgDaily) : null;
  var totalQty = orders.reduce(function (s, o) { return s + o.qty; }, 0);
  var lateOrders = orders.filter(function (o) { return o.late; });

  var risk = "healthy";
  if (lateOrders.length) risk = "critical";
  else if (shelfRisk) risk = "warning";
  else if (orders.length && orders[0] && daysBetween(horizonStart, orders[0].releaseDate) <= 7) risk = "warning";

  return {
    code: mat.code,
    name: mat.name || mat.code,
    unit: mat.unit || "u",
    shelfLifeDays: shelf,
    leadTimeDays: L,
    moq: mat.moq || 0,
    packSize: mat.packSize || 0,
    unitCost: mat.unitCost || 0,
    onHand: round2(onHand),
    grossRequirement: round2(totalGross),
    avgDailyUse: round2(avgDaily),
    safetyStock: safetyStock,
    coverageDays: coverageDays,
    runOutDate: runOutDate,
    firstShortfallDate: firstShortfallDate,
    orders: orders,
    orderCount: orders.length,
    totalOrderQty: round2(totalQty),
    totalCost: round2(totalQty * (mat.unitCost || 0)),
    lateOrders: lateOrders.length,
    shelfRisk: shelfRisk,
    risk: risk,
    usedBy: Object.keys(drivers || {}).sort(function (a, b) {
      return drivers[b] - drivers[a];
    }).slice(0, 5),
    consumption: consumed,
  };
}

// ───────────────────── recommendations ─────────────────────

function recommend(m, lang) {
  var es = lang === "es";
  var unit = m.unit;
  var fmtQ = function (v) { return Math.round(v).toLocaleString(es ? "es-419" : "en-CA"); };
  var fmtM = function (v) {
    return new Intl.NumberFormat(es ? "es-419" : "en-CA",
      { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(v);
  };

  // A material can be overdue AND structurally wasteful at the same time. The
  // urgent action wins the headline, but the second problem is not dropped —
  // it is attached as a note, because they call for different fixes: one is a
  // purchase order today, the other is a conversation with the supplier.
  var sourcingNote = null;
  if (m.shelfRisk && m.shelfRisk.forcedByMoq) {
    sourcingNote = es
      ? "Aparte: el MOQ de " + fmtQ(m.moq) + " " + unit + " te obliga a comprar " +
        m.shelfRisk.coverageDays + " días de cobertura sobre un material que vence a los " +
        m.shelfRisk.shelfLifeDays + " días — " + fmtM(m.shelfRisk.wasteValue) +
        " de merma por ciclo. Eso se arregla con el proveedor, no con el plan."
      : "Separately: the " + fmtQ(m.moq) + " " + unit + " MOQ forces you to buy " +
        m.shelfRisk.coverageDays + " days of coverage on a material that expires after " +
        m.shelfRisk.shelfLifeDays + " days — " + fmtM(m.shelfRisk.wasteValue) +
        " of waste per cycle. That is fixed with the supplier, not with the plan.";
  }

  if (m.lateOrders > 0) {
    var o = m.orders.filter(function (x) { return x.late; })[0];
    return {
      action: "order_now",
      headline: es ? "Ordena " + fmtQ(o.qty) + " " + unit + " hoy mismo"
                   : "Order " + fmtQ(o.qty) + " " + unit + " today",
      why: es
        ? "Con un lead time de " + m.leadTimeDays + " días, esta compra debió haberse colocado hace " +
          o.daysLate + " día(s) para llegar a tiempo a la producción del " + o.needDate + "."
        : "With a " + m.leadTimeDays + "-day lead time, this purchase should have been placed " +
          o.daysLate + " day(s) ago to arrive in time for the production run on " + o.needDate + ".",
      impact: es
        ? "Si no llega, esa producción no se puede hacer y el quiebre pasa al producto terminado."
        : "If it does not arrive, that production run cannot happen and the shortage moves to the finished product.",
      note: sourcingNote,
    };
  }

  if (m.shelfRisk) {
    var s = m.shelfRisk;
    return {
      action: s.forcedByMoq ? "sourcing" : "reduce",
      headline: s.forcedByMoq
        ? (es ? "El MOQ de este material te hace botar " + fmtQ(s.wasteUnits) + " " + unit
              : "This material's MOQ makes you discard " + fmtQ(s.wasteUnits) + " " + unit)
        : (es ? "Compra en lotes más pequeños y con más frecuencia"
              : "Buy in smaller lots, more often"),
      why: es
        ? "Una compra de " + fmtQ(s.orderQty) + " " + unit + " te cubre " + s.coverageDays +
          " días de consumo, pero el material vence a los " + s.shelfLifeDays + " días."
        : "An order of " + fmtQ(s.orderQty) + " " + unit + " covers " + s.coverageDays +
          " days of consumption, but the material expires after " + s.shelfLifeDays + " days.",
      impact: s.forcedByMoq
        ? (es ? "Son " + fmtM(s.wasteValue) + " de merma estructural por ciclo. No es un problema de planificación: necesitas un empaque menor o cambiar de proveedor."
              : "That is " + fmtM(s.wasteValue) + " of structural waste per cycle. This is not a planning problem: you need a smaller pack or a different supplier.")
        : (es ? "Evitas alrededor de " + fmtM(s.wasteValue) + " de producto vencido por ciclo."
              : "You avoid roughly " + fmtM(s.wasteValue) + " of expired material per cycle."),
    };
  }

  if (m.orders.length) {
    var n = m.orders[0];
    return {
      action: "order_soon",
      headline: es ? "Ordena " + fmtQ(n.qty) + " " + unit + " el " + n.releaseDate
                   : "Order " + fmtQ(n.qty) + " " + unit + " on " + n.releaseDate,
      why: es
        ? "Tu stock actual de " + fmtQ(m.onHand) + " " + unit + " alcanza para " +
          (m.coverageDays == null ? "—" : m.coverageDays) + " días al ritmo de consumo del plan, y el proveedor tarda " +
          m.leadTimeDays + " días."
        : "Your current stock of " + fmtQ(m.onHand) + " " + unit + " lasts " +
          (m.coverageDays == null ? "—" : m.coverageDays) + " days at the plan's consumption rate, and the supplier takes " +
          m.leadTimeDays + " days.",
      impact: es
        ? "Colocarla después de esa fecha corta la producción programada."
        : "Placing it after that date interrupts the scheduled production run.",
    };
  }

  return {
    action: "no_action",
    headline: es ? "No requiere compra en este horizonte" : "No purchase needed in this horizon",
    why: es
      ? "El stock actual de " + fmtQ(m.onHand) + " " + unit + " cubre todo el plan de producción."
      : "Current stock of " + fmtQ(m.onHand) + " " + unit + " covers the whole production plan.",
    impact: es ? "Revisa de nuevo cuando cambie el plan de demanda."
               : "Check again when the demand plan changes.",
  };
}

// ───────────────────── entry point ─────────────────────

/**
 * @param plans      finished-goods plans from the inventory engine
 * @param seriesBySku  { sku: { forecast: [{date,value,...}] } }
 * @param boms       [{ sku, material, qtyPerUnit, unit, scrapPct }]
 * @param materials  [{ code, name, unit, shelfLifeDays, leadTimeDays, leadTimeSdDays,
 *                      moq, packSize, unitCost, onHand }]
 * @param opts       { reviewPeriodDays, purchaseCoverDays, serviceLevel, lang }
 */
function run(plans, seriesBySku, boms, materials, opts) {
  opts = opts || {};
  var reviewPeriodDays = opts.reviewPeriodDays || 7;
  var purchaseCoverDays = opts.purchaseCoverDays || 30;
  var serviceLevel = opts.serviceLevel || 0.95;
  var lang = opts.lang || "es";

  var bomBySku = {};
  (boms || []).forEach(function (b) {
    if (!b || !b.sku || !b.material) return;
    (bomBySku[b.sku] = bomBySku[b.sku] || []).push(b);
  });

  var matByCode = {};
  (materials || []).forEach(function (m) { if (m && m.code) matByCode[m.code] = m; });

  // Only SKUs that actually have a recipe drive a material plan.
  var schedules = {};
  var planBySku = {};
  var startDate = null, endDate = null;
  plans.forEach(function (p) {
    planBySku[p.sku] = p;
    if (!bomBySku[p.sku]) return;
    var s = seriesBySku[p.sku];
    if (!s || !s.forecast || !s.forecast.length) return;
    if (!startDate) startDate = s.forecast[0].date;
    var last = s.forecast[s.forecast.length - 1].date;
    if (!endDate || last > endDate) endDate = last;
    schedules[p.sku] = productionSchedule(p, s.forecast, reviewPeriodDays);
  });

  var skusWithRecipe = Object.keys(schedules);
  if (!skusWithRecipe.length) {
    return {
      ok: false, reason: "no_recipes", materials: [], summary: null,
      skusWithRecipe: [], skusWithoutRecipe: plans.map(function (p) { return p.sku; }),
    };
  }

  var ex = explode(schedules, bomBySku);
  var out = [];
  var unknownMaterials = [];

  Object.keys(ex.gross).forEach(function (code) {
    var mat = matByCode[code];
    if (!mat) {
      unknownMaterials.push(code);
      // Still plan it, with neutral defaults, rather than dropping it silently.
      mat = { code: code, name: code, unit: "u", shelfLifeDays: null,
              leadTimeDays: 7, moq: 0, packSize: 0, unitCost: 0, onHand: 0 };
    }
    var m = planMaterial(mat, ex.gross[code], ex.drivers[code], {
      startDate: startDate, endDate: endDate,
      serviceLevel: serviceLevel, purchaseCoverDays: purchaseCoverDays,
    });
    m.recommendation = recommend(m, lang);
    m.recommendationEn = recommend(m, "en");
    m.recommendationEs = recommend(m, "es");
    m.known = !!matByCode[code];
    out.push(m);
  });

  var rank = { critical: 0, warning: 1, healthy: 2 };
  out.sort(function (a, b) {
    if (rank[a.risk] !== rank[b.risk]) return rank[a.risk] - rank[b.risk];
    return b.totalCost - a.totalCost;
  });

  var sum = function (f) { return out.reduce(function (s, m) { return s + f(m); }, 0); };
  var productionOrders = 0;
  skusWithRecipe.forEach(function (s) { productionOrders += schedules[s].length; });

  return {
    ok: true,
    materials: out,
    schedules: schedules,
    summary: {
      materialCount: out.length,
      materialsAtRisk: out.filter(function (m) { return m.risk !== "healthy"; }).length,
      lateOrders: sum(function (m) { return m.lateOrders; }),
      purchaseValue: round2(sum(function (m) { return m.totalCost; })),
      wasteValue: round2(sum(function (m) { return m.shelfRisk ? m.shelfRisk.wasteValue : 0; })),
      shelfRiskCount: out.filter(function (m) { return !!m.shelfRisk; }).length,
      productionOrders: productionOrders,
      skusWithRecipe: skusWithRecipe.length,
      unknownMaterials: unknownMaterials,
      startDate: startDate, endDate: endDate,
    },
    skusWithRecipe: skusWithRecipe,
    skusWithoutRecipe: plans.filter(function (p) { return !bomBySku[p.sku]; })
                            .map(function (p) { return p.sku; }),
  };
}

return { run: run, productionSchedule: productionSchedule, applyLotSize: applyLotSize,
         explode: explode, zScore: zScore, addDays: addDays, daysBetween: daysBetween };
});

function t(key, vars) {
  var s = (EXTRA[state.lang] && EXTRA[state.lang][key]) || EXTRA.en[key] || key;
  if (vars) for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
var esNow = function () { return state.lang === "es"; };

// ───────────────────────────── small helpers ─────────────────────────────
var $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
var N = function (v, d) { return E.num(v, state.lang, d || 0); };
var M = function (v) { return E.money(v, state.lang); };
var C = function (v, cur) { return E.compact(v, state.lang, cur); };
var P = function (v, d) { return E.pct(v, state.lang, d || 0); };
var LD = function (v) { return E.longDate(v, state.lang); };

function riskLabel(r) {
  return { critical: t("rCritical"), warning: t("rWarning"),
           healthy: t("rHealthy"), overstock: t("rOverstock") }[r] || r;
}

}

// Hero: a depletion path crossing its reorder point. Geometry is computed from
// the values so the labels always sit on the right part of the curve.
function depletionFigure() {
  var W = 560, H = 250, PL = 8, PR = 8, PT = 18, PB = 26;
  var start = 420, daily = 17, ss = 96, lt = 7, days = 30;
  var rop = ss + daily * lt, iw = W - PL - PR, ih = H - PT - PB, maxY = start * 1.08;
  var x = function (d) { return PL + (d / days) * iw; };
  var y = function (v) { return PT + ih - (v / maxY) * ih; };
  var wob = [1, .7, 1.35, .9, 1.1, 1.5, .6], path = [], v = start;
  for (var d = 0; d <= days; d++) { path.push({ d: d, v: Math.max(0, v) }); v -= daily * wob[d % 7]; }
  var line = path.map(function (p, i) { return (i ? "L" : "M") + x(p.d).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ");
  var area = line + " L" + x(days).toFixed(1) + "," + y(0).toFixed(1) + " L" + x(0).toFixed(1) + "," + y(0).toFixed(1) + " Z";
  var cross = function (lv) {
    for (var i = 1; i < path.length; i++) if (path[i].v <= lv) {
      var a = path[i - 1], b = path[i];
      return a.d + (a.v - lv) / Math.max(1e-6, a.v - b.v);
    }
    return null;
  };
  var rd = cross(rop), od = cross(0);
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto" role="img" aria-label="' + esc(t("figRop")) + '">';
  s += '<rect x="' + PL + '" y="' + y(ss) + '" width="' + iw + '" height="' + Math.max(0, y(0) - y(ss)) + '" fill="var(--critical)" opacity=".055"/>';
  s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(ss) + '" y2="' + y(ss) + '" stroke="var(--critical)" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>';
  s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(rop) + '" y2="' + y(rop) + '" stroke="var(--warning)" stroke-width="1.2" stroke-dasharray="5 4"/>';
  s += '<path d="' + area + '" fill="var(--ink-800)" opacity=".07"/>';
  s += '<path d="' + line + '" fill="none" stroke="var(--ink-800)" stroke-width="2.2" stroke-linejoin="round"/>';
  if (rd != null) {
    s += '<line x1="' + x(rd) + '" x2="' + x(rd) + '" y1="' + y(rop) + '" y2="' + (H - PB) + '" stroke="var(--warning)" stroke-width="1" opacity=".5"/>';
    s += '<circle cx="' + x(rd) + '" cy="' + y(rop) + '" r="5" fill="#fff" stroke="var(--warning)" stroke-width="2.5"/>';
    s += '<text x="' + x(rd) + '" y="' + (H - PB + 15) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--warning)">' + esc(t("figOrder")) + "</text>";
  }
  if (od != null && od <= days) {
    s += '<circle cx="' + x(od) + '" cy="' + y(0) + '" r="4.5" fill="var(--critical)"/>';
    s += '<text x="' + Math.min(x(od) + 8, W - PR) + '" y="' + (y(0) - 12) + '" text-anchor="start" font-size="11.5" font-weight="600" fill="var(--critical)">' + esc(t("figOut")) + "</text>";
  }
  s += '<text x="' + (PL + 2) + '" y="' + (y(rop) - 7) + '" font-size="11.5" font-weight="600" fill="var(--warning)">' + esc(t("figRop")) + "</text>";
  s += '<text x="' + (PL + 2) + '" y="' + (y(ss) + 15) + '" font-size="11.5" font-weight="600" fill="var(--critical)" opacity=".85">' + esc(t("figSs")) + "</text>";
  s += '<text x="' + (PL + 2) + '" y="' + (y(start) - 7) + '" font-size="11.5" font-weight="600" fill="var(--ink-800)">' + esc(t("figStock")) + "</text>";
  return s + "</svg>";
}

// Demand history + forecast with a confidence band.
function demandChart(hist, fc, h) {
  h = h || 260;
  var W = 900, PL = 48, PR = 12, PT = 16, PB = 26, H = h;
  var iw = W - PL - PR, ih = H - PT - PB;
  var all = hist.map(function (p) { return p.v; })
    .concat(fc.map(function (p) { return p.hi; }));
  var maxV = Math.max.apply(null, all.concat([1])) * 1.08;
  var nTot = hist.length + fc.length;
  if (!nTot) return "";
  var x = function (i) { return PL + (nTot < 2 ? 0 : (i / (nTot - 1)) * iw); };
  var y = function (v) { return PT + ih - (Math.max(0, v) / maxV) * ih; };

  var s = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto" role="img" aria-label="' + esc(t("chartTitle")) + '">';
  // gridlines
  for (var g = 0; g <= 4; g++) {
    var gv = (maxV / 4) * g, gy = y(gv);
    s += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--g-100)"/>';
    s += '<text x="' + (PL - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="var(--g-500)">' + esc(C(gv)) + "</text>";
  }
  // forecast band
  if (fc.length) {
    var up = [], dn = [];
    for (var i = 0; i < fc.length; i++) {
      var xi = x(hist.length + i);
      up.push(xi.toFixed(1) + "," + y(fc[i].hi).toFixed(1));
      dn.unshift(xi.toFixed(1) + "," + y(fc[i].lo).toFixed(1));
    }
    s += '<polygon points="' + up.concat(dn).join(" ") + '" fill="var(--ink-600)" opacity=".14"/>';
  }
  // history line
  if (hist.length) {
    s += '<polyline fill="none" stroke="var(--ink-800)" stroke-width="1.9" stroke-linejoin="round" points="' +
      hist.map(function (p, i) { return x(i).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ") + '"/>';
  }
  // forecast line, joined to the last actual so there is no visual gap
  if (fc.length) {
    var pts = [];
    if (hist.length) pts.push(x(hist.length - 1).toFixed(1) + "," + y(hist[hist.length - 1].v).toFixed(1));
    for (var j = 0; j < fc.length; j++) pts.push(x(hist.length + j).toFixed(1) + "," + y(fc[j].v).toFixed(1));
    s += '<polyline fill="none" stroke="var(--warning)" stroke-width="2" stroke-dasharray="5 4" points="' + pts.join(" ") + '"/>';
    var sx = x(hist.length - 1);
    s += '<line x1="' + sx + '" x2="' + sx + '" y1="' + PT + '" y2="' + (PT + ih) + '" stroke="var(--g-300)" stroke-dasharray="2 3"/>';
  }
  // date ticks
  var labelAt = [0, Math.floor(nTot * .25), Math.floor(nTot * .5), Math.floor(nTot * .75), nTot - 1];
  var dates = hist.map(function (p) { return p.d; }).concat(fc.map(function (p) { return p.d; }));
  labelAt.forEach(function (i) {
    if (!dates[i]) return;
    s += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--g-500)">' +
      esc(E.shortDate(dates[i], state.lang)) + "</text>";
  });
  s += "</svg>";
  var legend = '<div style="display:flex;gap:18px;justify-content:flex-end;font-size:12.5px;color:var(--g-500);padding:0 12px 6px">' +
    '<span><span style="display:inline-block;width:14px;height:2px;background:var(--ink-800);vertical-align:middle;margin-right:5px"></span>' + esc(t("actual")) + "</span>" +
    '<span><span style="display:inline-block;width:14px;height:2px;background:var(--warning);vertical-align:middle;margin-right:5px"></span>' + esc(t("forecast")) + "</span></div>";
  return legend + s;
}

var TEMPLATE_ORDER = ["ventas", "inventario", "recetas", "materiales"];

function tmplHeaders(key) {
  return TEMPLATES[key].cols.map(function (c) { return c.h[state.lang] || c.h.en; });
}
function csvCell(v) {
  var s = v == null ? "" : String(v);
  return /[",\n;]/.test(s) ? '"' + s.split('"').join('""') + '"' : s;
}
function templateCsv(key) {
  var T = TEMPLATES[key];
  var lines = [tmplHeaders(key).map(csvCell).join(",")];
  T.rows.forEach(function (r) { lines.push(r.map(csvCell).join(",")); });
  return "﻿" + lines.join("\n");
}
function download(filename, content, mime) {
  var blob = content instanceof Blob ? content : new Blob([content], { type: mime || "text/plain" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 120);
}
window.downloadTemplateCsv = function (key) {
  download("datanova-" + (TEMPLATES[key].file[state.lang] || TEMPLATES[key].file.en) + ".csv",
    templateCsv(key), "text/csv;charset=utf-8");
};

// One workbook with every sheet plus a readable instructions tab — far easier
// to hand to someone than four separate files.
window.downloadTemplateXlsx = function (btn) {
  var original = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = t("tmplBuilding"); }
  loadSheetJs().then(function () {
    var XLSX = window.XLSX;
    var wb = XLSX.utils.book_new();
    var es = esNow();

    var intro = [
      [es ? "DATANOVA FORECAST — PLANTILLA DE CARGA" : "DATANOVA FORECAST — DATA TEMPLATE"],
      [es ? "Desarrollado por Datanova Studio" : "Built by Datanova Studio"],
      [""],
      [es ? "Llena las hojas con tus datos y sube cada una a la herramienta."
          : "Fill the sheets with your data and upload each one to the tool."],
      [es ? "Las filas de ejemplo están para mostrarte el formato: bórralas antes de subir."
          : "The example rows are there to show the format: delete them before uploading."],
      [es ? "Solo la hoja de ventas es obligatoria." : "Only the sales sheet is required."],
      [""],
      [es ? "HOJA" : "SHEET", es ? "COLUMNA" : "COLUMN", es ? "¿OBLIGATORIA?" : "REQUIRED?",
       es ? "QUÉ VA AQUÍ" : "WHAT GOES HERE"],
    ];
    TEMPLATE_ORDER.forEach(function (k) {
      var T = TEMPLATES[k];
      T.cols.forEach(function (c, i) {
        intro.push([i === 0 ? (T.title[state.lang] || T.title.en) : "",
                    c.h[state.lang] || c.h.en,
                    c.req ? (es ? "Sí" : "Yes") : (es ? "No" : "No"),
                    c.d[state.lang] || c.d.en]);
      });
      intro.push(["", "", "", ""]);
      intro.push([es ? "Nota:" : "Note:", T.note[state.lang] || T.note.en]);
      intro.push(["", "", "", ""]);
    });
    var ws0 = XLSX.utils.aoa_to_sheet(intro);
    ws0["!cols"] = [{ wch: 26 }, { wch: 24 }, { wch: 13 }, { wch: 92 }];
    XLSX.utils.book_append_sheet(wb, ws0, es ? "Instrucciones" : "Instructions");

    TEMPLATE_ORDER.forEach(function (k) {
      var T = TEMPLATES[k];
      var aoa = [tmplHeaders(k)].concat(T.rows.map(function (r) { return r.slice(); }));
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = tmplHeaders(k).map(function (h) { return { wch: Math.max(12, h.length + 4) }; });
      var name = (T.title[state.lang] || T.title.en).slice(0, 28).replace(/[\\/?*[\]:]/g, "");
      XLSX.utils.book_append_sheet(wb, ws, name);
    });

    var out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    download("datanova-forecast-" + (es ? "plantilla" : "template") + ".xlsx",
      new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  }).catch(function () {
    // Offline: fall back to the CSVs, which need no library at all.
    TEMPLATE_ORDER.forEach(function (k) { window.downloadTemplateCsv(k); });
  }).then(function () {
    if (btn) { btn.disabled = false; btn.textContent = original; }
  });
};

// ───────────────────────────── routing ─────────────────────────────
var VIEWS = ["landing", "work", "sku"];

function go(v, arg) {
  state.view = v;
  if (v === "sku") state.skuOpen = arg;
  VIEWS.forEach(function (n) { $("v-" + n).classList.toggle("hidden", n !== v); });
  $("btnRestart").classList.toggle("hidden", v === "landing" || !state.sales);
  render();
  window.scrollTo(0, 0);
}
window.go = go;

function gotoStep(n) {
  if (n === 2 && !state.sales) return;
  if (n === 3 && !state.run) return;
  state.step = n;
  state.view = "work";
  VIEWS.forEach(function (x) { $("v-" + x).classList.toggle("hidden", x !== "work"); });
  [1, 2, 3].forEach(function (i) { $("step-" + i).classList.toggle("hidden", i !== n); });
  $("btnRestart").classList.remove("hidden");
  render();
  window.scrollTo(0, 0);
}
window.gotoStep = gotoStep;

window.restart = function () {
  if (!confirm(esNow() ? "¿Borrar los datos cargados y empezar de nuevo?"
                       : "Clear the loaded data and start over?")) return;
  state.sales = null; state.salesStats = null; state.inventory = null;
  state.recipes = null; state.materials = null; state.run = null; state.mrp = null;
  state.issues = []; state.invIssues = []; state.recipeIssues = []; state.matIssues = [];
  state.lastFile = null; state.step = 1; state.openSlot = null;
  go("landing");
};

function setLang(l) {
  state.lang = l;
  try { localStorage.setItem("df_lang", l); } catch (e) {}
  document.documentElement.lang = l;
  render();
}
window.setLang = setLang;

function render() {
  Array.prototype.forEach.call($("langGroup").querySelectorAll("button"), function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("lang") === state.lang));
  });
  var rl = $("btnRestart").querySelector(".rl");
  if (rl) rl.textContent = t("restart");
  $("btnRestart").setAttribute("title", t("restart"));
  $("footTag").textContent = t("footTag");
  $("footBy").textContent = t("footBy");
  $("footLogo").src = DATANOVA_STUDIO_LOGO;

  if (state.view === "landing") { renderLanding(); return; }
  if (state.view === "sku") { renderSku(); return; }

  renderRail();
  if (state.step === 1) renderStep1();
  if (state.step === 2) renderStep2();
  if (state.step === 3) renderStep3();
}

function renderRail() {
  var steps = [
    { n: 1, label: t("railData"), ok: !!state.sales, enabled: true },
    { n: 2, label: t("railParams"), ok: !!state.run, enabled: !!state.sales },
    { n: 3, label: t("railResults"), ok: false, enabled: !!state.run },
  ];
  $("rail").innerHTML = steps.map(function (s) {
    var cls = "rail-step" + (s.n === state.step ? " on" : (s.ok ? " done" : ""));
    return '<button class="' + cls + '"' + (s.enabled ? "" : " disabled") +
      ' onclick="gotoStep(' + s.n + ')"><span class="rn">' +
      (s.ok && s.n !== state.step ? "✓" : s.n) + "</span>" + esc(s.label) + "</button>";
  }).join("");
}

var RISK_ORDER = { critical: 0, warning: 1, overstock: 2, healthy: 3 };

function tableRows() {
  var tb = state.table, q = tb.q.trim().toLowerCase();
  var rows = state.run.plans.filter(function (p) {
    if (tb.risk !== "all" && p.risk !== tb.risk) return false;
    if (tb.abc !== "all" && p.abc !== tb.abc) return false;
    if (!q) return true;
    return (p.sku + " " + p.product + " " + (p.category || "")).toLowerCase().indexOf(q) >= 0;
  });
  var get = function (p) {
    switch (tb.sort) {
      case "risk": return RISK_ORDER[p.risk];
      case "sku": return p.sku;
      case "product": return p.product;
      case "onHand": return p.onHand;
      case "horizonDemand": return p.horizonDemand;
      case "daysOfSupply": return p.daysOfSupply == null ? Number.MAX_SAFE_INTEGER : p.daysOfSupply;
      case "safetyStock": return p.safetyStock.value;
      case "reorderPoint": return p.reorderPoint;
      case "suggestedOrder": return p.suggestedOrder;
      default: return 0;
    }
  };
  return rows.sort(function (a, b) {
    var av = get(a), bv = get(b);
    if (typeof av === "string") return String(av).localeCompare(String(bv)) * tb.dir;
    if (tb.sort === "risk" && av === bv) {
      return (b.unmetValue + b.demandValue) - (a.unmetValue + a.demandValue);
    }
    return (av - bv) * tb.dir;
  });
}

window.exportCsv = function () {
  var H = ["SKU", "Product", "Category", "ABC", "Demand pattern", "Forecast method",
    "Lead time (days)", "On hand", "On order", "Inventory position", "Avg daily demand",
    "Forecast (horizon)", "Demand over lead time", "Safety stock", "Safety stock method",
    "Reorder point", "Order-up-to level", "Suggested order", "Days of supply",
    "Projected stockout date", "Risk", "Confidence", "Lead-time WAPE", "Revenue at risk",
    "Excess units", "Inventory value", "Recommendation", "Why"];
  var q = function (v) {
    var s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.split('"').join('""') + '"' : s;
  };
  var lines = [H.join(",")];
  state.run.plans.forEach(function (p) {
    lines.push([p.sku, p.product, p.category || "", p.abc || "", p.pattern, p.model,

      p.projectedStockoutDate || "", p.risk, p.confidence, p.wape == null ? "" : p.wape,
      p.unmetValue, p.excessUnits, p.inventoryValue,
      esNow() ? p.recommendation.headlineEs : p.recommendation.headline,
      esNow() ? p.recommendation.whyEs : p.recommendation.why].map(q).join(","));
  });
  // BOM so Excel opens accented characters without an import wizard
  var blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);

};

// ───────────────────────────── ABC ─────────────────────────────
function renderAbc() {
  var r = state.run;
  if (!r) { gotoStep(1); return; }
  var plans = r.plans;
  var total = plans.reduce(function (s, p) { return s + p.demandValue; }, 0) || 1;
  var classes = ["A", "B", "C"].map(function (c) {
    var items = plans.filter(function (p) { return p.abc === c; })
      .sort(function (a, b) { return b.demandValue - a.demandValue; });
    return {
      cls: c, items: items,
      value: items.reduce(function (s, p) { return s + p.demandValue; }, 0),
      atRisk: items.filter(function (p) { return p.risk === "critical" || p.risk === "warning"; }).length,
    };
  });
  var cols = ["var(--ink-800)", "var(--ink-600)", "var(--g-300)"];
  var label = { A: t("classA"), B: t("classB"), C: t("classC") };

  var h = '<div style="margin-top:16px"><h3 style="font-size:16px">' + esc(t("abcTitle")) + "</h3>" +
    '<p style="margin-top:4px;max-width:72ch;font-size:13.5px;color:var(--g-500)">' + esc(t("abcSub")) + "</p>" +
    '<p style="margin-top:4px;font-size:13px;color:var(--g-500)">' + esc(t("abcCrit")) + ": " +
    esc(state.params.abcCriterion === "revenue" ? t("abcRev") : t("abcVol")) + " · A ≤ " +
    Math.round(state.params.abcACut * 100) + "% · B ≤ " + Math.round(state.params.abcBCut * 100) + "%</p></div>";

  // A single stacked bar reads the Pareto split faster than three cards.
  h += '<div class="card" style="margin-top:20px;padding:20px"><div style="display:flex;height:36px;border-radius:6px;overflow:hidden">' +
    classes.map(function (g, i) {
      var pctw = Math.max(2, (g.value / total) * 100);
      return '<div title="' + esc(g.cls + ": " + g.items.length) + '" style="width:' + pctw +
        "%;background:" + cols[i] + ';display:flex;align-items:center;justify-content:center;' +
        'font-size:12px;font-weight:600;color:#fff">' + (pctw > 7 ? g.cls : "") + "</div>";
    }).join("") + "</div>" +
    '<dl class="grid" style="margin:16px 0 0;grid-template-columns:repeat(3,1fr);gap:16px">' +
    classes.map(function (g) {
      return '<div><dt style="font-size:12.5px;color:var(--g-500)">' + esc(label[g.cls]) + "</dt>" +
        '<dd class="tnum" style="margin:4px 0 0;font-size:19px;font-weight:600">' + g.items.length +
        ' <span style="font-size:12.5px;font-weight:400;color:var(--g-500)">' + esc(t("countP")) + "</span></dd>" +
        '<p class="tnum" style="font-size:12.5px;color:var(--g-500)">' + esc(P(g.value / total)) + " " +
        esc(t("share")) + "</p></div>";
    }).join("") + "</dl></div>";

  h += '<p class="reasoning" style="margin-top:20px">' + t("abcProse", {
    n: classes[0].items.length, p: P(classes[0].value / total), r: classes[0].atRisk,
  }) + "</p>";

  classes.forEach(function (g, gi) {
    h += '<div class="card" style="margin-top:16px"><div style="padding:16px 20px 12px">' +
      '<h3 style="font-size:15px;display:flex;align-items:center;gap:8px">' +
      '<span class="tag tag-' + g.cls.toLowerCase() + '">' + g.cls + "</span>" + esc(label[g.cls]) + "</h3>" +
      '<p style="margin-top:2px;font-size:13px;color:var(--g-500)">' + g.items.length + " " +
      esc(t("countP")) + " · " + esc(M(g.value)) + " · " + esc(P(g.value / total)) + " " + esc(t("share")) + "</p></div>";
    if (!g.items.length) {
      h += '<p style="padding:0 20px 20px;font-size:13px;color:var(--g-500)">' + esc(t("abcEmpty")) + "</p>";
    } else {
      h += '<div style="max-height:380px;overflow-y:auto;border-top:1px solid var(--g-100)">' +
        '<ul style="margin:0;padding:0;list-style:none">' + g.items.slice(0, 50).map(function (p) {
          return '<li style="display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:10px 20px;' +
            'border-bottom:1px solid var(--g-100)">' + riskBadge(p.risk) +
            '<button class="sku-link" style="font-size:13.5px" onclick="go(\'sku\',\'' + esc(p.sku) + '\')">' +
            esc(p.product) + "</button>" +
            '<span style="font-size:12.5px;color:var(--g-500)">' + esc(p.sku) + "</span>" +
            '<span class="tnum" style="margin-left:auto;font-size:13px;color:var(--g-700)">' + esc(M(p.demandValue)) + "</span>" +
            '<span class="tnum" style="width:100px;text-align:right;font-size:12.5px;color:var(--g-500)">' +
            esc(N(p.horizonDemand)) + " " + esc(t("units")) + "</span></li>";
        }).join("") + "</ul></div>";
    }
    h += "</div>";
  });
  $("abcBody").innerHTML = h;
}

// SheetJS is fetched only when a real spreadsheet is opened or an Excel
// template is requested, so a CSV-only user never pays for it.
var sheetJsPromise = null;
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve();
  if (sheetJsPromise) return sheetJsPromise;
  sheetJsPromise = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = function () { resolve(); };
    s.onerror = function () { sheetJsPromise = null; reject(new Error("SHEETJS_NOT_LOADED")); };
    document.head.appendChild(s);
  });
  return sheetJsPromise;
}

window.slotOver = function (e, key, on) {
  e.preventDefault();
  var el = $("slot-" + key);
  if (el) el.classList.toggle("over", !!on);
};
window.slotDrop = function (e, key) {
  e.preventDefault();
  var el = $("slot-" + key);
  if (el) el.classList.remove("over");
  var f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f, key);
};
window.pickFile = function (e, key) {
  var f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (f) handleFile(f, key);
};

function firstErrorText(issues) {
  for (var i = 0; i < issues.length; i++) {
    if (issues[i].severity === "error") return esNow() ? issues[i].titleEs : issues[i].title;
  }
  return t("errRead");
}

var READ_KIND = { ventas: "sales", inventario: "inventory", recetas: "recipes", materiales: "materials" };

function handleFile(file, kind) {
  state.uploadError = null;
  var isExcel = /\.(xlsx|xls)$/i.test(file.name);
  (isExcel ? loadSheetJs() : Promise.resolve())
    .then(function () { return file.arrayBuffer(); })
    .then(function (buf) { return E.readTable(buf, file.name, { kind: READ_KIND[kind] }); })
    .then(function (table) {
      if (table.sheetNames && table.sheetNames.length > 1) {
        state.sheetNotes[kind] = { used: table.sheetName, all: table.sheetNames };
      } else {
        delete state.sheetNotes[kind];
      }
      if (kind === "ventas") {
        state.lastFile = { table: table, name: file.name };
        applySalesValidation();
      } else if (kind === "inventario") {
        var known = state.sales ? new Set(state.sales.map(function (r) { return r.sku; })) : undefined;
        var v = E.validateInventory(table, known);
        state.invIssues = v.issues; state.invMapping = v.mapping;
        if (!v.ok) { state.inventory = null; state.uploadError = firstErrorText(v.issues); }
        else state.inventory = v.rows;
      } else if (kind === "recetas") {
        var knownSkus = state.sales ? new Set(state.sales.map(function (r) { return r.sku; })) : undefined;
        var rv = E.validateRecipes(table, knownSkus);
        state.recipeIssues = rv.issues;
        if (!rv.ok) { state.recipes = null; state.uploadError = firstErrorText(rv.issues); }
        else state.recipes = rv.rows;
      } else if (kind === "materiales") {
        var used = state.recipes
          ? new Set(state.recipes.map(function (r) { return r.material; })) : undefined;
        var mv = E.validateMaterials(table, used);
        state.matIssues = mv.issues;
        if (!mv.ok) { state.materials = null; state.uploadError = firstErrorText(mv.issues); }
        else state.materials = mv.rows;
      }
      state.run = null; state.mrp = null;
      render();
    })
    .catch(function (err) {
      if (err && err.message === "SHEETJS_NOT_LOADED") state.uploadError = t("errXlsx");
      else if (err && err.messageEs) state.uploadError = esNow() ? err.messageEs : err.message;
      else state.uploadError = t("errRead") + (err && err.message ? " " + err.message : "");
      render();
    });
}

function applySalesValidation() {
  var v = E.validateSales(state.lastFile.table, state.clean);
  state.issues = v.issues;
  state.mapping = v.mapping;
  state.unmatched = v.unmatchedColumns;
  state.salesStats = v.stats;
  state.run = null; state.mrp = null;
  if (!v.ok) {
    state.sales = null;
    state.uploadError = firstErrorText(v.issues);
    if (!v.stats.recordCount) { state.lastFile = null; state.salesStats = null; }
  } else {
    state.sales = v.rows;
    state.uploadError = null;
  }
}

window.addRecipe = function () {
  var last = draft.recipes[draft.recipes.length - 1];
  var seed = blankRecipeLine();
  // Carry the product forward: a recipe is normally entered one product at a time.
  if (last && last.sku) seed.sku = last.sku;
  draft.recipes.push(seed);

};
window.removeRecipe = function (i) { draft.recipes.splice(i, 1); renderRecipeEditor(); };
window.saveRecipes = function () {
  var rows = draft.recipes.map(function (r) {
    var scrap = Number(r.scrapPct) || 0;
    if (scrap > 0 && scrap < 1) scrap *= 100;
    return {
      sku: String(r.sku || "").trim(),
      material: String(r.material || "").trim(),
      materialName: String(r.materialName || "").trim() || null,
      qtyPerUnit: Number(r.qtyPerUnit) || 0,
      unit: String(r.unit || "").trim() || null,
      scrapPct: Math.min(95, Math.max(0, scrap)),
    };
  }).filter(function (r) { return r.sku && r.material && r.qtyPerUnit > 0; });

  state.recipes = rows.length ? rows : null;
  state.recipeIssues = [];
  state.run = null; state.mrp = null;

  // Any material named in a recipe but missing from the master gets a stub, so
  // the user is never silently planning something with no shelf life or cost.
  if (rows.length) {
    var known = {};
    (state.materials || []).forEach(function (m) { known[m.code] = 1; });
    var added = [];
    rows.forEach(function (r) {
      if (!known[r.material]) {
        known[r.material] = 1;
        added.push({ code: r.material, name: r.materialName || r.material, unit: r.unit || "u",

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
